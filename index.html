<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1437">
<title>The Night Watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1437'/%3E%3Crect x='10' y='9' width='12' height='17' rx='4' fill='%23ffd86b'/%3E%3Crect x='11' y='5' width='10' height='4' rx='1.5' fill='%23b98a4a'/%3E%3C/svg%3E">
<style>
:root {
  --night: #0b1437; --night2: #1b2a6b; --gold: #ffd86b; --cream: #fff6da;
  --go: #3fae5e; --no: #e0553f; --panel: rgba(13, 22, 60, .86); --line: rgba(255, 216, 107, .45);
  --u: clamp(14px, 2.2vmin + 6px, 22px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--cream);
  font: 600 var(--u)/1.3 ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* Side insets (notch in landscape) are applied here; top and bottom insets are added by the bars themselves. */
#ui { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left); right: env(safe-area-inset-right); pointer-events: none; }
#live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
canvas.ic { display: inline-block; vertical-align: middle; flex: none; }

button { font: inherit; color: inherit; }
.btn { min-width: 48px; min-height: 48px; padding: .45em 1em; border: 3px solid rgba(255, 255, 255, .35); border-radius: 999px;
  background: #2b3f8f; color: #fff; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: .45em; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); transition: transform .08s, filter .15s; }
.btn:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.btn:focus-visible, .tile:focus-visible, .card:focus-visible, .pal:focus-visible, .stk:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
.btn.go { background: var(--go); } .btn.no { background: var(--no); }
.btn.gold { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.btn.big { font-size: 1.35em; padding: .5em 1.4em; min-height: 64px; }
.btn.round { padding: 0; width: 52px; height: 52px; }
.btn[disabled] { filter: grayscale(1) brightness(.7); cursor: default; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); filter: brightness(1.2); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: .5em; padding: .4em .5em;
  padding-top: calc(.4em + env(safe-area-inset-top)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .sp { flex: 1; pointer-events: none; }
.pill { display: inline-flex; align-items: center; gap: .3em; min-height: 40px; padding: .15em .7em; border-radius: 999px;
  background: var(--panel); border: 2px solid var(--line); font-weight: 800; white-space: nowrap; }

.home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: .6em; text-align: center; pointer-events: none; }
.home > * { pointer-events: auto; }
.title { margin: .2em 0 0; font-size: clamp(30px, 9vmin, 76px); line-height: 1; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 3px #201400, 0 3px 0 #7a4c00, 0 0 18px rgba(255, 200, 80, .7); letter-spacing: .01em; pointer-events: none; }
.home .mid { flex: 1; pointer-events: none; }
.home .row { display: flex; gap: .6em; align-items: center; justify-content: center; flex-wrap: wrap; margin: .35em 0; }
.langs { display: inline-flex; gap: .3em; padding: .25em; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
.langs .btn { min-height: 48px; padding: .1em .7em .1em .4em; box-shadow: none; background: transparent; border-color: transparent; }
.langs .btn[aria-pressed=true] { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.foot { font-size: max(11px, .72em); font-weight: 600; opacity: .85; max-width: 34em; margin: .2em 0 calc(.2em + env(safe-area-inset-bottom)); text-shadow: 0 1px 3px #000; }

/* the phone's keyboard covers the lower part of the page: --kb is its height (20-core.js), and a dialog keeps clear of it */
.veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: .7em; padding-bottom: calc(.7em + var(--kb, 0px)); background: rgba(6, 10, 32, .55); pointer-events: auto; }
.veil.day { background: rgba(255, 196, 140, .08); }   /* first light: the sunrise behind the dialog stays bright */
.veil.clear { background: rgba(6, 10, 32, .16); }     /* news of a gift: the tree and the sky stay in view */
/* (where a panel scrolls on a desktop browser, its scrollbar is thin and in the game's colours, not a white strip) */
.dlg { width: min(34em, 100%); max-height: 100%; overflow: auto; padding: .8em; border-radius: 1.4em; background: var(--panel);
  border: 3px solid var(--line); text-align: center; box-shadow: 0 0 40px rgba(255, 200, 80, .25); scrollbar-width: thin; scrollbar-color: rgba(255, 216, 107, .55) transparent; }
.dlg h2 { margin: 0 0 .3em; font-size: 1.3em; color: var(--gold); }
.owlrow { display: flex; align-items: center; gap: .5em; text-align: left; }
.bubble { position: relative; flex: 1; padding: .6em .8em; border-radius: 1.1em; background: var(--cream); color: #2a1c05; font-size: 1.1em; font-weight: 800; }
.bubble::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right: 13px solid var(--cream); }
.pics { display: flex; gap: .4em; align-items: center; justify-content: center; flex-wrap: wrap; margin: .5em 0 0; }
.acts { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin-top: .7em; }
.stars { display: flex; gap: .2em; justify-content: center; margin: .3em 0; }
.stars canvas { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.stars canvas:nth-child(2) { animation-delay: .25s; } .stars canvas:nth-child(3) { animation-delay: .5s; }
.goals { display: flex; flex-direction: column; gap: .2em; align-items: flex-start; margin: .4em auto 0; width: fit-content; font-size: .85em; text-align: left; }
.goals div { display: flex; align-items: center; gap: .4em; opacity: .55; } .goals .on { opacity: 1; }
input.name { font: inherit; font-weight: 800; text-align: center; width: min(14em, 100%); min-height: 48px; border-radius: 999px;
  border: 3px solid var(--line); background: #fff; color: #2a1c05; padding: .2em .8em; user-select: text; -webkit-user-select: text; }

.hub { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .5em;
  padding: 3.6em .6em calc(.7em + env(safe-area-inset-bottom)); pointer-events: none; }
.hub > * { pointer-events: auto; }
.hub h2 { margin: 0; font-size: 1.5em; color: var(--gold); text-shadow: 0 2px 6px #000; pointer-events: none; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; width: min(40em, 100%); }
.card { display: flex; flex-direction: column; align-items: center; gap: .15em; min-height: 96px; padding: .5em .3em; border-radius: 1.1em;
  background: var(--panel); border: 3px solid var(--line); cursor: pointer; font-weight: 800; font-size: .85em; line-height: 1.1;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.card:active { transform: translateY(3px); }
.card .stars { margin: 0; } .card .stars canvas { animation: none; }
.card.done { border-color: #8fe3a4; }
.card.bonus { border-style: dashed; }   /* tonight's extra station: a bonus, never needed for the raid */
.cards.four { grid-template-columns: repeat(4, 1fr); }
.cards.four .card { font-size: max(11px, .78em); padding: .45em .15em; }
a.btn { text-decoration: none; }
.btn.round { position: relative; }
.dot { position: absolute; top: 1px; right: 1px; width: 15px; height: 15px; border-radius: 50%; background: var(--gold); border: 2px solid #fff; box-shadow: 0 0 8px var(--gold); }
.certdlg { width: min(46em, 100%); }
img.cert { display: block; width: 100%; max-height: calc(100vh - 9em); object-fit: contain; border-radius: .6em; }
.whos { display: flex; flex-direction: column; gap: .4em; margin: .4em 0; }
.who { display: flex; gap: .4em; align-items: center; }
.who > .btn:first-child { flex: 1; min-width: 0; justify-content: flex-start; }
.who > .btn:first-child span { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who.me > .btn:first-child { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.bday { gap: 1em; }
.bday select { font: inherit; font-weight: 800; min-width: 3.6em; min-height: 48px; margin-left: .3em; border-radius: .6em; border: 2px solid #8fa4d8; background: #fff; color: #1b2550; }
#print { display: none; }
@media print {
  @page { size: landscape; margin: 10mm; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #c, #ui, #live { display: none !important; }
  #print { display: block; } #print img { width: 100%; }
}

.bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .5em; align-items: center; justify-content: center; flex-wrap: wrap;
  padding: .5em .5em calc(.5em + env(safe-area-inset-bottom)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.gatebtns .btn { flex: 1 1 40%; max-width: 15em; min-height: 68px; font-size: 1.3em; }
.badgebar { flex-direction: column; flex-wrap: nowrap; }
.ref { position: absolute; top: calc(4em + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: .5em; align-items: center;
  padding: .25em .7em; border-radius: 1em; background: var(--panel); border: 2px solid var(--line); pointer-events: none; max-width: 96%; }
.ref .sep { width: 2px; align-self: stretch; background: var(--line); }
.ref .lab { display: inline-flex; flex-direction: column; align-items: center; font-size: max(11px, .62em); font-weight: 700; line-height: 1.1; }

/* .forge and .side: a panel under the scene in portrait, beside it in landscape */
.forge, .side { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: .35em; align-items: center;
  padding: .4em .4em calc(.4em + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(6, 10, 32, .9) 22%); pointer-events: none; }
.forge > *, .side > * { pointer-events: auto; }
.side .row { display: flex; gap: .5em; align-items: center; justify-content: center; flex-wrap: wrap; }
.wears { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3em; width: min(26em, 100%); }
.wears .pal { max-width: none; min-width: 0; cursor: pointer; touch-action: manipulation; }
.pal.try { border-color: #fff; box-shadow: 0 0 0 3px var(--gold); }
.album { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: .4em;
  padding: calc(4em + env(safe-area-inset-top)) .5em calc(.5em + env(safe-area-inset-bottom)); pointer-events: none; }
.album > * { pointer-events: auto; }
.tabs { display: flex; gap: .3em; flex-wrap: wrap; justify-content: center; }
.tabs .btn { padding: .2em .8em .2em .4em; font-size: .85em; }
.tabs .btn[aria-pressed=true] { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.stks { display: grid; gap: .4em; width: min(45em, 100%); flex: 1; min-height: 0; align-content: center; }
.stk { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em; min-height: 64px; padding: .2em;
  border-radius: 1em; border: 3px solid var(--line); background: var(--panel); font-weight: 800; font-size: max(11px, .7em); line-height: 1.1; cursor: pointer; }
.stk.none { border-style: dashed; opacity: .7; }
.stk.new::after { content: ""; position: absolute; top: 5px; right: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--gold);
  border: 2px solid #fff; box-shadow: 0 0 8px var(--gold); }
.pill.got { border-radius: 1.2em; text-align: left; padding: .3em .8em .3em .4em; white-space: normal; line-height: 1.15; }
.slots { display: flex; gap: .25em; min-height: 58px; padding: .25em; width: min(38em, 100%); justify-content: center; flex-wrap: wrap;
  border-radius: 1em; border: 3px dashed var(--line); background: rgba(0, 0, 0, .3); }
.tiles { display: flex; gap: .3em; flex-wrap: wrap; justify-content: center; width: min(40em, 100%); }
.tile { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 56px; min-height: 56px; padding: .15em .35em;
  border-radius: .8em; border: 3px solid #fff3c4; background: #fff6da; color: #2a1c05; font-weight: 800; font-size: max(11px, .7em); line-height: 1.05; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.tile b { font-size: 1.9em; line-height: 1.1; }
.tile.n { background: #cfe8ff; border-color: #fff; border-radius: 50%; } .tile.s { background: #ffd9ec; border-color: #fff; border-radius: .2em 1.2em; }
.tile:active { transform: translateY(2px); }
.meter { width: min(38em, 100%); text-align: center; font-weight: 900; text-shadow: 0 1px 3px #000; }
.meter .track { position: relative; height: 22px; border-radius: 999px; background: rgba(0, 0, 0, .45); border: 2px solid var(--line); overflow: hidden; }
.meter .fill { height: 100%; width: 0; border-radius: 999px; background: repeating-linear-gradient(45deg, #ffd86b 0 10px, #f2a93b 10px 20px); transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }
.meter .flag { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #fff; box-shadow: 0 0 6px #fff; }
.meter .val { font-size: 1.25em; color: var(--gold); text-shadow: 0 2px 4px #000; }

.palette { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .3em; align-items: stretch; justify-content: center; flex-wrap: wrap;
  padding: .4em .4em calc(.4em + env(safe-area-inset-bottom)); background: rgba(6, 10, 32, .88); border-top: 2px solid var(--line); pointer-events: auto; }
.pal { flex: 1 0 17%; max-width: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 62px; min-height: 58px; padding: .2em .3em;
  border-radius: .9em; border: 3px solid var(--line); background: #22327a; font-weight: 800; font-size: .72em; cursor: grab; touch-action: none; }
.pal.sel { background: #f2b93b; color: #3a2400; border-color: #fff; }
.pal.poor { opacity: .45; }
.pal span { display: inline-flex; align-items: center; gap: .15em; }
.pal.more { border-style: dashed; background: #4a3470; cursor: pointer; touch-action: manipulation; }   /* turns the palette's page */
.replay { position: absolute; left: 50%; top: calc(4.2em + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: .5em; align-items: center; pointer-events: none; }
.replay > * { pointer-events: auto; }
.replay .pill { background: var(--no); border-color: #fff; color: #fff; }
.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: .4em 1em; border-radius: 999px; background: var(--cream); color: #2a1c05;
  font-weight: 900; font-size: 1.15em; pointer-events: none; animation: toast 1.6s both; width: max-content; max-width: 94%; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.8); } 12%, 75% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -14px); } }

/* Landscape: the treehouse keeps the left half, menus take the right half. */
@media (min-aspect-ratio: 23/20) {
  .home, .hub { left: 50%; justify-content: center; }
  .home .mid { flex: 0; }
  .forge, .side { left: 45%; top: 3.6em; justify-content: center; background: none; }
  .ref { left: auto; right: .5em; transform: none; }
  .badgebar { left: 50%; top: 0; }
  .title { font-size: clamp(26px, 6.5vw, 72px); }
}
@media (min-width: 560px) { .pal { flex: 0 0 auto; } }   /* room for a whole page in one row */
@media (max-width: 380px) { .langs .btn { padding: .1em .4em .1em .2em; } .home .row { gap: .4em; } .home .btn.round { width: 48px; height: 48px; } }
@media (max-width: 430px) {
  .hud { gap: .25em; padding-left: .3em; padding-right: .3em; }
  .hud .pill { padding: .1em .45em; font-size: .82em; }
  .hud .btn.round { width: 48px; height: 48px; }
  .gatebtns .btn { font-size: 1.1em; gap: .3em; padding: .3em .6em; }
  .tbar .helper > span { display: none; }   /* the Tinker Treehouse's bar: the helper's picture only, so that the test button keeps its words */
}
/* phones and anything lower: smaller tiles keep the Password Forge scene large */
@media (max-height: 700px) {
  .tile { min-width: 48px; min-height: 48px; } .tile b { font-size: 1.5em; } .slots { min-height: 50px; }
}
@media (max-height: 520px) {
  .card { min-height: 64px; } .foot { font-size: max(11px, .62em); }
  /* dialogs must fit a 360 px high screen without scrolling */
  .dlg { padding: .5em .7em; } .dlg h2 { font-size: 1.1em; margin: 0; }
  .dlg .stars canvas { width: 30px !important; height: 30px !important; }
  .dlg canvas.owl { width: 70px !important; height: 65px !important; }
  .bubble { font-size: 1em; padding: .4em .6em; }
  .goals { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .1em .8em; font-size: .75em; margin-top: .2em; }
  .pics { margin-top: .3em; } .acts { margin-top: .4em; }
}
/* A phone on its side: station bars drop the extra pills, and the Tinker palette becomes a two-column strip on the right. */
@media (min-aspect-ratio: 23/20) and (max-height: 520px) {
  .hud.slim .extra, .hud.slim #pStars, .hud.slim #pBeams { display: none; }
  .whos { display: grid; grid-template-columns: 1fr 1fr; }   /* the players two by two, so that the settings under them stay on the screen */
  /* the Password Forge: the bar keeps to one row and scrolls sideways when it holds more tiles than fit (a second row lay
     under the tray, out of sight and out of reach); auto margins keep a short row in the middle */
  .slots { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .slots .tile { flex: none; } .slots > :first-child { margin-left: auto; } .slots > :last-child { margin-right: auto; }
  .palette { left: auto; top: 4.6em; width: 15.6em; align-content: flex-start; border-top: 0; border-left: 2px solid var(--line); overflow-y: auto; }   /* three columns: a page of nine fits without scrolling */
  .pal { flex: 1 0 28%; min-height: 52px; }
  /* the gate reference card stands as a narrow column at the right edge, clear of the visitor's speech bubble */
  .ref { flex-direction: column; gap: .15em; padding: .3em .4em; }
  .ref .sep { width: auto; height: 2px; }
  .ref canvas.ic { width: 26px !important; height: 26px !important; }
}
/* A phone on its side: a one-line title leaves room for the shelf of extras on the home screen. */
@media (min-aspect-ratio: 23/20) and (max-height: 520px) {
  .title { font-size: clamp(22px, 4.1vw, 34px); }
  .home .row { margin: .2em 0; gap: .4em; } .home .btn.round { width: 48px; height: 48px; } .home .btn.big { min-height: 54px; font-size: 1.2em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .toast { animation: none !important; }   /* its last keyframe is invisible; without motion it simply shows until it is removed */
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="live" aria-live="polite"></div>
<script>
(() => {
'use strict';
// ---------- Localization: every UI string, [English, Russian, Italian] side by side ----------
const LANGS = ['en', 'ru', 'it'];
const L = {
  title: ['The Night Watch', 'Ночной патруль', 'La Guardia Notturna'],
  lang: ['Language', 'Язык', 'Lingua'],
  langName: ['English', 'Русский', 'Italiano'],   // each language under its own name, whatever the current language is
  foot: ['A game about watching carefully, checking kindly, and building cleverly.',
    'Игра о том, как смотреть внимательно, проверять по-доброму и строить с умом.',
    'Un gioco per osservare con attenzione, controllare con gentilezza e costruire con ingegno.'],
  play: ['Play', 'Играть', 'Gioca'],
  ok: ['OK', 'Хорошо', 'OK'],
  go: ['Go!', 'Вперёд!', 'Via!'],
  retry: ['Try again', 'Ещё раз', 'Riprova'],
  home: ['Home', 'Домой', 'Casa'],
  sound: ['Sound', 'Звук', 'Suono'],
  done: ['Done', 'Готово', 'Fatto'],
  night: ['Night {n}', 'Ночь {n}', 'Notte {n}'],
  nameAsk: ['What is your name, Chief?', 'Как тебя зовут, командир?', 'Come ti chiami, Capo?'],
  nameDef: ['Chief', 'Командир', 'Capo'],
  win: ['Well done, Chief!', 'Молодец, командир!', 'Ottimo lavoro, Capo!'],
  bonus: ['Bonus star!', 'Звезда в подарок!', 'Stella bonus!'],
  soft: ['The magpies were extra sneaky tonight.', 'Этой ночью сороки были особенно хитрыми.', 'Stanotte le gazze erano furbissime.'],

  rank0: ['Cadet', 'Кадет', 'Recluta'],

  dawnT: ['First light', 'Рассвет', 'Prime luci'],
  dawn1: ['The sun is up and the magpies are asleep. Want to go fishing until evening?', 'Солнце встало, сороки спят. Пойдёшь на рыбалку до вечера?', 'È spuntato il sole e le gazze dormono. Vuoi andare a pescare fino a sera?'],
  dawnFish: ['Go fishing', 'На рыбалку', 'A pescare'], dawnRest: ['Rest until evening', 'Отдохнуть до вечера', 'Riposare fino a sera'],
  // gifts from the Legendary fish of First Light Fishing: the owl tells each piece of news once, at the Night menu
  giftT: ['A gift from the water', 'Подарок от воды', 'Un dono dell\'acqua'],
  gift_biscuit: ['Grandpa Biscuit has moved into the pond by our tree. Tap the water and say hello!', 'Дедушка Сухарик переехал в пруд у нашего дерева. Тронь воду и поздоровайся!', 'Nonno Biscotto si è trasferito nello stagno accanto al nostro albero. Tocca l\'acqua e salutalo!'],
  gift_heron: ['The heron of Willow Creek stands by our tree now. Shh, it sleeps on one leg.', 'Цапля с Ивового ручья теперь стоит у нашего дерева. Тише, она спит на одной ноге.', 'L\'airone del Ruscello dei Salici ora sta accanto al nostro albero. Piano, dorme su una zampa sola.'],
  gift_lanternjaw: ['Old Lanternjaw sent us a lantern. It hangs under the branch and never goes out.', 'Старый Фонарник прислал нам фонарь. Он висит под веткой и никогда не гаснет.', 'Il Vecchio Mascellone ci ha mandato una lanterna. Pende sotto il ramo e non si spegne mai.'],
  gift_noise: ['The White Noise sent its mist. At night it drifts around the roots of our tree.', 'Белый Шум прислал свой туман. Ночью он стелется у корней нашего дерева.', 'Il Rumore Bianco ha mandato la sua nebbia. Di notte scivola tra le radici del nostro albero.'],
  gift_millstone: ['The Millstone left a real millstone by the tree. A fine seat for a guard!', 'Жёрнов оставил у дерева настоящий жёрнов. Отличное сиденье для часового!', 'La Macina ha lasciato una vera macina accanto all\'albero. Un bel sedile per una guardia!'],
  gift_aurora: ['Sister Aurora sent her colours. Look up at the sky!', 'Сестрица Аврора прислала свои краски. Посмотри на небо!', 'Sorella Aurora ha mandato i suoi colori. Guarda il cielo!'],
  gift_wave: ['The Ninth Wave races across our sky now. Watch for a silver streak!', 'Девятый Вал теперь проносится по нашему небу. Ищи серебряную полоску!', 'La Nona Onda ora corre nel nostro cielo. Cerca una scia d\'argento!'],
  gift_postman: ['The Abyssal Postman sent lights from the Deep. They float up around our tree.', 'Почтальон Бездны прислал огоньки из глубины. Они тихо поднимаются вокруг нашего дерева.', 'Il Postino degli Abissi ha mandato luci dal profondo. Salgono piano attorno al nostro albero.'],
  gift_bell: ['The Bellwether left a small bell on our branch. Tap it and it rings.', 'Колокольный Вожак оставил на нашей ветке колокольчик. Тронь его, и он зазвенит.', 'Il Campanaccio ha lasciato una campanella sul nostro ramo. Toccala e suona.'],
  // bedtime: after so many Nights in one real day (a grown-up sets how many)
  bedT: ['Good night', 'Спокойной ночи', 'Buona notte'],
  bed1: ['What a Night, Chief! The jars are safe, and I am sleepy. Good night. See you tomorrow!', 'Вот это ночка, командир! Банки целы, а меня клонит в сон. Спокойной ночи. До завтра!', 'Che notte, Capo! I barattoli sono al sicuro e io ho sonno. Buona notte. A domani!'],
  bedOk: ['Good night', 'Спокойной ночи', 'Buona notte'], bedMore: ['Grown-ups', 'Для взрослых', 'Per i grandi'],
  bedSet: ['Bedtime', 'Отбой', 'Nanna'], bedOff: ['off', 'выкл.', 'mai'],
  bedAsk: ['For grown-ups: after how many Nights in one day does the owl say good night?', 'Для взрослых: после скольких ночей за день сова говорит «спокойной ночи»?', 'Per i grandi: dopo quante Notti in un giorno il gufo dà la buona notte?'],
  // the day's first words: what happened last time (src/50-ui.js, greet)
  mem_perfect: ['Last time every jar stayed safe. Well done!', 'В прошлый раз все банки остались на месте. Отличная работа!', 'L\'ultima volta tutti i barattoli sono rimasti al sicuro. Ottimo lavoro!'],
  mem_lost: ['Last time the magpies took a jar or two. Tonight we watch even closer.', 'В прошлый раз сороки унесли банку-другую. Сегодня будем смотреть ещё внимательнее.', 'L\'ultima volta le gazze hanno preso qualche barattolo. Stanotte guardiamo ancora meglio.'],
  mem_hard: ['Last time was a hard Night. Tonight we try again, together.', 'Прошлая ночь выдалась трудной. Сегодня попробуем ещё раз, вместе.', 'L\'ultima Notte è stata dura. Stanotte riproviamo, insieme.'],
  mem_promo: ['You got a new badge last time. It suits you!', 'В прошлый раз у тебя появился новый значок. Он тебе идёт!', 'L\'ultima volta hai ricevuto un distintivo nuovo. Ti sta benissimo!'],
  mem_boss: ['Last time Baron von Shiny went home with nothing. He is still grumbling!', 'В прошлый раз Барон фон Блеск улетел ни с чем. Он до сих пор ворчит!', 'L\'ultima volta il Barone von Luccichio è tornato a casa a mani vuote. Brontola ancora!'],
  mem_laugh: ['Last time the magpies laughed so much that they forgot the jars!', 'В прошлый раз сороки так смеялись, что забыли про банки!', 'L\'ultima volta le gazze hanno riso così tanto da dimenticare i barattoli!'],
  mem_fish: ['You went fishing at first light. I hope the fish were biting!', 'На рассвете была рыбалка. Надеюсь, клевало!', 'All\'alba si è pescato. Spero che i pesci abbiano abboccato!'],
  mem_bed: ['Last time bedtime came right on time. A rested watcher sees more!', 'В прошлый раз отбой был вовремя. Кто выспался, тот видит больше!', 'L\'ultima volta la nanna è arrivata puntuale. Chi ha dormito bene vede di più!'],
  mem_away: ['It is so good to see you again! The forest missed you.', 'Как хорошо, что ты снова здесь! Лес по тебе скучал.', 'Che bello rivederti! Il bosco sentiva la tua mancanza.'],
  // the birthday (a grown-up sets the date in the players panel); fish for supper after a good day's fishing
  bday1: ['Happy birthday!', 'С днём рождения!', 'Buon compleanno!'],
  bday2: ['The whole forest dressed up the treehouse for you. Here is a party hat!', 'Весь лес украсил для тебя домик на дереве. Держи праздничный колпак!', 'Tutto il bosco ha addobbato per te la casa sull\'albero. Ecco un cappellino da festa!'],
  bdaySet: ['Birthday', 'День рождения', 'Compleanno'], bdayDay: ['Day', 'День', 'Giorno'], bdayMon: ['Month', 'Месяц', 'Mese'],
  eye1: ['Thank you for the fish supper! My eyes are sharp tonight. At the gate, tap the eye and I will take a close look for you.', 'Спасибо за рыбку на ужин! Сегодня у меня зоркие глаза. У ворот нажми на глаз, и я хорошенько рассмотрю гостя.', 'Grazie del pesce per cena! Stanotte ho la vista acuta. Al cancello tocca l\'occhio e guardo bene io per te.'],

// ----- Hub: the Night menu -----

  sky: true,

// ----- First light: the day between two Nights. The magpies sleep; the Chief may go fishing (the sister game) or rest. -----
// The day is pending in the save from the end of a Night until this choice is made, so closing the page cannot lose it.
scenes.dawn = {
  leave(url) { location.href = url; },   // a method of its own, so that a test can watch the way out instead of leaving the page
  enter() {

    owlSay(t('dawn1'), { title: t('dawnT'), mood: 'cheer', acts: [
      { label: t('dawnRest'), icon: 'moon', fn: over(() => go('hub')) },
      // if the page is still here a while later, there was no way to the fishing game: the Night goes on instead
      { label: t('dawnFish'), cls: 'go', icon: 'fish', fn: over(() => { this.leave('fishing/index.html#day'); later(() => go('hub'), 6000); }) }] }).classList.add('day');
  },
  draw() {
    const T = treeArea(), t0 = V.t, k = still() ? 1 : Math.min(1, (t0 - this.t0) / 2.5), g = ctx.createLinearGradient(0, 0, 0, V.h);
    drawSky(ctx, t0);

    g.addColorStop(0, `rgba(104,150,222,${.8 * k})`); g.addColorStop(.5, `rgba(255,192,150,${.8 * k})`); g.addColorStop(.8, `rgba(255,214,150,${.6 * k})`); g.addColorStop(1, `rgba(255,214,150,${.4 * k})`);

// The browser's Back button brings this page back as it was left: on the morning screen, with its question already answered.
addEventListener('pageshow', e => { if (e.persisted && scene === scenes.dawn) go('hub'); });

// ----- Gifts from the water: the Legendary fish of the day leave gifts at the treehouse (the fishing game shares this
// site's storage). The owl tells each piece of news once, at the Night menu; from then on the gift is part of the night
// (src/49-gifts.js draws it). -----
function giftsEarned() {
  try { const log = (JSON.parse(localStorage.getItem('firstlight.v1' + (slot ? '.' + (slot + 1) : '')) || '{}') || {}).log || {}; return GIFTS.filter(id => log[id] && log[id].n > 0); } catch (e) { return []; }
}
function giftNews(then) {
  const id = giftsEarned().find(g => !S.gifts[g]);
  if (!id) return then();
  S.gifts[id] = 1; save();
  // The veil of this dialog is almost clear. When the owl has spoken, a sparkle shows where to look, and the rest waits a moment.
  owlSay(t('gift_' + id), { title: t('giftT'), mood: 'cheer', acts: [{ label: t('ok'), cls: 'go', icon: 'yes', fn: () => {
    const [x, y] = giftAt(id, treeArea());
    sfx.sparkle(); burst(x, y, 26, { speed: 200, size: 9, kind: 'star', colors: ['#ffd86b', '#fff6da', '#9fe8ff'] });
    later(() => giftNews(then), 1400);
  } }] }).classList.add('clear');
}

// ----- The day's first words: what happened last time, or the birthday. After a good day's fishing there is fish for
// supper, and with it an owl's eye for tonight's Gate Check. -----
function remember(k) { S.mem = { d: today(), k }; }
const dayNo = s => { const [y, m, d] = String(s).split('-').map(Number); return Math.round(Date.UTC(y || 1970, (m || 1) - 1, d || 1) / 864e5); };
const isBirthday = () => !!S.bday && (today(), S.bday === todayMD || S.bday === todayAlso);
// What the day's fishing brought (the fishing game leaves a note in the shared storage): a memory, and from three fish on, supper.
function supper() {
  try {
    const r = JSON.parse(localStorage.getItem('firstlight.day' + (slot ? '.' + (slot + 1) : '')) || 'null');
    if (!r || !(r.n > 0) || !Number.isSafeInteger(r.id) || r.id < 0 || String(r.id) === S.sup) return false;   // the id is the time the day's fishing began
    S.sup = String(r.id); remember('fish');
    if (r.n < 3) return false;
    S.eye = 1;
    return true;
  } catch (e) { return false; }
}
function greet(then) {
  const d = today(), y = +d.split('-')[0], parts = [], fish = supper();
  const party = isBirthday() && S.bdayY !== y;   // once a year: the party hat for the wardrobe and a few moonbeams, also when the date was set later that day
  if (party) { S.bdayY = y; S.own.party = 1; S.beams += 30; parts.push(t('bday1'), t('bday2')); }
  if (S.memD !== d) {
    const away = S.memD ? dayNo(d) - dayNo(S.memD) : 0;   // days since the last visit to the Night menu
    S.memD = d;
    if (!party && away >= 7) parts.push(t('mem_away'));
    else if (!party && S.mem.k && !fish && L['mem_' + S.mem.k]) parts.push(t('mem_' + S.mem.k));
  }
  if (fish) parts.push(t('eye1'));
  save();
  if (!parts.length) return then();
  if (party) { music.mood('party'); sfx.fanfare(); burst(V.w / 2, V.h * .35, 50, { colors: ['#ffd86b', '#ff9ecb', '#7fd0ff', '#6fdc95'], speed: 340, kind: 'star', size: 9, life: 1.5 }); refreshHud(); }
  owlSay(parts.join(' '), { mood: 'cheer', quiet: party,
    html: party ? `<div class="pics">${ic('wear:party', 56)}<span class="pill pop">${ic('beam', 22)}<b>+30</b></span></div>` : fish ? picsHtml(['fish', 'fish', 'fish']) : '',
    acts: [{ label: t('ok'), cls: 'go', icon: 'yes', fn: then }] });
}

// ----- Bedtime: after so many Nights in one real day the owl says good night until tomorrow. A grown-up sets how many
// (in the players panel; 0 switches it off) and can allow one more Night. The watch's day turns at four in the morning. -----
// The watch's day ('Y-M-D') and its month and day ('M-D'). Drawing asks for them in every frame (the birthday, today's
// visitor), so they are worked out once a second. On 28 February of a year without a 29th, the 29th counts as today
// too: a child born on that day has a birthday every year.
let todayAt = -1, todayS = '', todayMD = '', todayAlso = '';
const today = () => {
  const s = Math.floor(Date.now() / 1e3);
  if (s !== todayAt) {
    const d = new Date(Date.now() - 144e5); todayAt = s; todayMD = (d.getMonth() + 1) + '-' + d.getDate(); todayS = d.getFullYear() + '-' + todayMD;
    todayAlso = todayMD === '2-28' && new Date(d.getFullYear(), 1, 29).getMonth() !== 1 ? '2-29' : '';
  }
  return todayS;
};
const asleep = () => S.bedN > 0 && S.bed.d === today() && S.bed.n >= S.bedN + S.bed.more;
scenes.bed = {
  enter() {
    remember('bed'); save();   // tomorrow's first words praise the rested watcher
    owlSay(t('bed1'), { title: t('bedT'), acts: [
      { label: t('bedMore'), icon: 'lock', fn: () => askGrownUp(() => { S.bed.more++; save(); go('hub'); }, () => go('bed')) },
      { label: t('bedOk'), cls: 'go', icon: 'moon', fn: () => go('home') }] });
  },
  draw() {
    const T = treeArea(), t0 = V.t;
    drawSky(ctx, t0); drawTree(ctx, T, t0); lifeTree(ctx, T, t0);
    treeOwl(ctx, T, t0, 'sleep');
    ctx.fillStyle = 'rgba(4,8,28,.4)'; ctx.fillRect(0, 0, V.w, V.h);   // the lights are low
    fireflies(ctx, t0, 5);
  },
};

// The Night ends after the raid: stars, moonbeams, maybe a promotion, then the Tinker Treehouse, then first light.
// closeNight() counts and saves it the moment the raid is over; the owl's word about it may come later (after a replay).
function closeNight(stolen, laughed = 0) {
  const stars = stolen === 0 ? 3 : stolen === 1 ? 2 : 1, old = rank();
  S.stars += stars; S.beams += 15 + stars * 10; S.nest = stolen; S.night++; S.st = { cam: 0, gate: 0, forge: 0, extra: 0 };
  S.promo = rank() > old;   // kept in the save, so closing the page here cannot skip the ceremony
  S.day = 1;                // nor the day that follows the Night
  if (stolen === 0) S.lit++;   // a Night without a lost jar lights one lantern on the Watchwood map of the fishing game
  // (once his museum is open the Baron is no grumbler any more: that Night is remembered for itself)
  remember(S.boss === S.night - 1 && S.saga < 3 ? 'boss' : S.promo ? 'promo' : laughed ? 'laugh' : stolen === 0 ? 'perfect' : stolen >= 3 ? 'hard' : 'lost');
  if (S.bed.d !== today()) S.bed = { d: today(), n: 0, more: 0 };
  S.bed.n++;                // Nights finished today, for bedtime
  save();
  return stars;
}
function finishNight(stolen, stars = closeNight(stolen)) {
  stolen ? sfx.hoot() : sfx.win();
  // the first lantern comes with a word about what it is for
  owlSay(stolen ? t('raid1') + ' ' + t('raid2') : t('raid0') + (S.lit === 1 ? ' ' + t('lit1') : ''), { title: t('night', { n: S.night - 1 }), stars, mood: stolen ? 'idle' : 'cheer', quiet: true,
    html: `<div class="pics"><span class="pill pop">${ic('beam', 22)}<b>+${15 + stars * 10}</b></span>${stolen ? '' : `<span class="pill pop">${ic('lamp', 22)}${esc(t('litNew'))}</span>`}</div>`,
    acts: [{ label: t('ok'), cls: 'go', icon: 'yes', fn: () => S.promo ? go('badge', { promo: true }) : go('tinker') }] });
}

scenes.story = {
  enter(o = {}) {
    this.r = clamp(o.rank || rank() || 1, 1, 3); this.then = o.then || (() => go('hub')); this.i = 0;
    this.hud = hud(() => go('home'), '', true);
    // The caption card reuses the ceremony's bar: at the bottom in portrait, the right half in landscape.
    // Two caption lines are always reserved, so the panel keeps its size from page to page.
    this.box = $('.dlg', add(`<div class="bar badgebar"><div class="dlg" style="width:min(26em,100%)"><h2>${esc(t('st_t' + this.r))}</h2>
      <p id="stCap" style="margin:.2em 0;font-size:1.15em;font-weight:800;min-height:2.6em;display:flex;align-items:center;justify-content:center"></p>
      <div class="pics" id="stDots" aria-hidden="true"></div>
      <div class="acts"><button class="btn go big" id="stNext">${ic('play', 30)}${esc(t('st_next'))}</button></div></div></div>`));
    $('#stNext').onclick = () => this.next();
    $('#stNext').focus({ preventScroll: true });
    this.show();
  },
  show() {
    this.at = V.t;
    const cap = t(`st_c${this.r}${this.i + 1}`);
    $('#stCap').textContent = cap;
    // page dots: pages seen are filled, the current one is bigger, so the colour is never the only cue
    $('#stDots').innerHTML = [0, 1, 2].map(j => { const z = j === this.i ? 20 : 14; return `<span style="width:${z}px;height:${z}px;border-radius:50%;border:3px solid var(--gold);background:${j <= this.i ? 'var(--gold)' : 'none'}"></span>`; }).join('');
    say(cap); speak(cap);
    if (this.i < 2) return sfx.pop();
    // the last panel lands with a bump: cream, feathers or stars fly
    const p = this.rect();
    sfx[['puff', 'bonk', 'sparkle'][this.r - 1]]();
    burst(p.x + p.w / 2, p.y + p.h * .7, 26, [{ colors: ['#fff6f0', '#ff9ecb', '#f7c9a0'], speed: 240 },
      { kind: 'feather', colors: ['#1a1a22', '#f4f4f0', '#3f6fe0'], speed: 200, g: 120, life: 1.3, size: 9 },
      { kind: 'star', colors: ['#ffd86b', '#fff', '#7fd0ff'], speed: 220, size: 8 }][this.r - 1]);
  },
  next() {
    if (this.i > 2 || V.t - this.at < .35) return;   // a quick double tap never skips a panel
    if (++this.i > 2) return this.then();
    this.show();
  },
  // Enter and Space on a focused button already click it; anywhere else they turn the page, as ArrowRight always does.
  key(e) {
    if (e.key === 'ArrowRight' || (e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) { e.preventDefault(); this.next(); }
  },
  // A tap on the picture just sparkles; only Next turns the page, so a stray tap never skips a caption.
  down(x, y) {
    const p = this.rect();
    if (x > p.x && x < p.x + p.w && y > p.y && y < p.y + p.h) { sfx.chirp(); burst(x, y, 10, { speed: 140, size: 7, colors: ['#ffd86b', '#fff6da'] }); }
  },
  // The panel fills the room above the caption card (portrait) or left of it (landscape), never much taller than wide.
  rect() {
    const d = this.box.getBoundingClientRect(), m = 10, ay = this.hud.getBoundingClientRect().bottom;
    const aw = (wide() ? d.left : V.w) - 2 * m, ah = (wide() ? V.h : d.top) - ay - m;
    const w = Math.min(aw, ah * 1.4), h = Math.min(ah, aw * .95);
    return { x: m + (aw - w) / 2, y: ay + (ah - h) / 2, w, h };
  },
  draw() {
    const T = still() ? 1 : V.t, k = still() ? 99 : V.t - this.at, p = this.rect(), pop = still() ? 1 : ease(clamp(k / .35, 0, 1));
    this.panel = [p.x, p.y, p.w, p.h];   // read by the layout audit: the overlay must not cover it
    drawSky(ctx, T); fireflies(ctx, T, 8);
    ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h / 2); ctx.scale(.94 + .06 * pop, .94 + .06 * pop); ctx.translate(-p.w / 2, -p.h / 2);
    rr(ctx, 0, 7, p.w, p.h, 18); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    rr(ctx, 0, 0, p.w, p.h, 18); ctx.fillStyle = '#fff6da'; ctx.fill();   // the cream comic frame
    ctx.save(); rr(ctx, 6, 6, p.w - 12, p.h - 12, 13); ctx.clip();
    // the box sits on the panel's bottom edge, so a tall panel shows more sky, never more empty ground
    const u = Math.min((p.w - 12) / 360, (p.h - 12) / 300);
    ctx.translate(p.w / 2 - 180 * u, p.h - 6 - 300 * u); ctx.scale(u, u);
    storyBg(ctx, T, this.r === 3 && this.i < 2);
    storyPanels[this.r - 1][Math.min(this.i, 2)](ctx, T, k);
    ctx.restore();
    if (pop < 1) { rr(ctx, 6, 6, p.w - 12, p.h - 12, 13); ctx.fillStyle = `rgba(255,246,218,${1 - pop})`; ctx.fill(); }   // a new panel appears out of a soft flash
    ctx.restore();
  },
};
// ---------- Tinker Treehouse and raids: design, test, watch, improve ----------
// Who comes tonight. Better station results mean fewer raiders; the plan is fixed per Night, so a test raid is a fair prediction.
// From Night 9 the numbers stay at Night 8's and new tricks come instead (src/91-arc.js).
function raidPlan(n, st) {
  const c = Math.min(n, 8), routes = c <= 2 ? ['lt', 'rt'] : c <= 4 ? ['lt', 'rt', 'lb', 'rb'] : ['lt', 'rt', 'lb', 'rb', 'sky'];
  const branch = Math.min(Math.ceil(c / 2) + (3 - st.cam), 7), gate = Math.min(3 - st.gate + (c >= 4 ? 1 : 0), 3), list = [];
  let at = 1;
  for (let i = 0; i < branch; i++) {
    list.push({ route: routes[((c >= 6 ? i >> 1 : i) + n) % routes.length], at });   // from Night 6 partners share a route
    at += c >= 4 && i % 2 === 0 ? (c >= 6 ? .9 : .3) : 3.2;   // later Nights: partners arrive together
  }
  for (let i = 0; i < gate; i++) list.push({ route: 'lad', at: 2 + i * 3.5 });
  arcTricks(n, list);
  return list.sort((a, b) => a.at - b.at);
}
const covers = (d, key) => {
  if (d.t === 'bell' && key !== 'lad') return false;
  const p = ROUTES[key];
  for (let s = 100; s <= p.len; s += 25) { const [x, y] = routeAt(p, s); if (Math.hypot(x - d.x, y - d.y) < d.r) return true; }
  return false;
};
// The chosen helper (src/57-pals.js) and the weather of Night n (src/47-season.js) count in test raids too, so a test stays
// fair. The raid passes its own Night: when it is over the Night has been counted, and the replay must not run in the
// weather of the next one.
function makeRaid(plan, holds, n = S.night) {
  const P = palPerk(), W = nightWeather(n), cd = it => (ITEMS[it.t].cd || 0) * (P === 'post' && (it.t === 'cam' || it.t === 'bell') ? .8 : 1);
  const at = it => ({ t: it.t, x: MOUNTS[it.m][0], y: MOUNTS[it.m][1], r: ITEMS[it.t].r * (P === 'lamp' && it.t === 'lamp' || P === 'music' && ITEMS[it.t].silly ? 1.2 : 1), cd: 0, cd0: cd(it) });
  const R = { t: 0, holds: holds + (P === 'guard' ? 1 : 0), shield: count('shield') + (P === 'garden' ? 1 : 0), spd: 1 - (W.slow || 0), wind: W.k === 'wind',
    stolen: 0, reached: {}, covered: {}, beams: [], done: false, zipX: 500, zipY: 150,
    cams: S.items.filter(i => i.t === 'cam' || i.t === 'bell').map(at), lamps: S.items.filter(i => i.t === 'lamp').map(at),
    toys: S.items.filter(i => ITEMS[i.t].silly).map(at), arc: S.items.filter(i => ITEMS[i.t].arc).map(at), fun: [], puffs: [], laughed: 0, mags: plan.map(arcRaider) };
  R.timed = R.cams.concat(R.arc);   // everything that recharges, for the rings the raid draws in every frame
  if (P === 'baker' && R.mags.length) R.mags[0].at += 5;   // the first magpie stops for a bun
  for (const k in ROUTES) R.covered[k] = R.cams.some(d => covers(d, k));
  return R;
}
// Silly gadgets. Each gadget plays its trick on every magpie once. The antic (m.fx) holds the magpie up, a jar it carried pops free,
// and a magpie that met three gadgets goes home laughing. Antics close together are a chain: R.fun remembers them for the replay.
const ANTIC = { peel: ['slip', .7], tramp: ['boing', .9], tickle: ['giggle', 1.7], bubbler: ['bubble', 2.4], cannon: ['bang', .6], disco: ['dance', 3] };   // antic and its seconds
function prank(R, m, g, x, y) {
  const [k, T] = ANTIC[g.t];
  m.met.add(g); m.fx = { k, t: T, T, dir: m.state === 'back' ? -1 : 1 }; m.dizzy = 0;
  m.combo = R.t - m.last < 3 ? m.combo + 1 : 1; m.last = R.t;
  R.fun.push({ t: R.t, w: m.combo });
  R.puffs.push({ k: g.t, x: g.x, y: g.y - 20, t: 1.2, n: m.combo });
  if (m.carry) { m.carry = false; m.state = 'sulk'; m.home = 1; R.zipX = x; R.zipY = y - 60; sfx.sparkle(); }   // Zip catches the jar and takes it home
  sfx[{ peel: 'slip', tramp: 'boing', tickle: 'giggle', bubbler: 'bubble', cannon: 'bang', disco: 'disco' }[g.t]]();
  buzz(20);
}
const STEP = 1 / 60;   // raids run in fixed steps, so the same design always gives the same raid (and the replay can run it again)
function stepRaid(R, dt) {
  R.t += dt;
  for (const d of R.cams) d.cd -= dt;
  for (const d of R.arc) d.cd -= dt;
  for (const b of R.beams) b.t -= dt;
  for (const b of R.puffs) b.t -= dt;
  R.beams = R.beams.filter(b => b.t > 0); R.puffs = R.puffs.filter(b => b.t > 0);
  let alive = 0;
  for (const m of R.mags) {
    if (m.state === 'gone') continue;
    alive++;
    if (m.state === 'wait') { if (R.t >= m.at) m.state = 'go'; continue; }
    const p = ROUTES[m.route], [x, y] = routeAt(p, m.d), active = m.state === 'go' || m.state === 'back';
    if (m.fx) {
      // a slip slides on the way the magpie was going; a bounce or a bang throws it back the way it came
      const a = m.fx;
      a.t -= dt;
      m.d = clamp(m.d + dt * a.dir * ({ slip: 300, boing: -260, bang: -300 }[a.k] || 0), 1, p.len - 1);
      if (a.t <= 0) {
        m.fx = null; m.dizzy = { slip: 1, boing: .6, bang: .8, bubble: .6 }[a.k] || 0;
        if (m.met.size >= 3 && m.state === 'go') { m.state = 'flee'; m.happy = true; m.home = 1; R.laughed += m.n; }
      }
    } else if (m.dizzy > 0) m.dizzy -= dt;
    else m.d += dt * 170 * R.spd * (R.wind && m.kind === 'balloon' ? .6 : 1) * { go: 1, back: -1.15, flee: -3, sulk: -1.3 }[m.state];
    if (m.kind && active && arcStep(R, m, x, y)) continue;   // a trickster meets the gadget that answers it (src/91-arc.js)
    // `home` marks a magpie sent home without a jar: it counts as caught kindly when a real raid ends
    if (!arcIgnores(m, 'cam') && (active || m.dizzy > 0 && m.state !== 'flee' && m.state !== 'sulk')) {
      const cam = R.cams.find(d => d.cd <= 0 && (d.t === 'cam' || m.route === 'lad') && Math.hypot(x - d.x, y - d.y) < d.r);
      if (cam) {
        cam.cd = cam.cd0;
        if (m.n > 1) arcSplit(R, m, x, y);   // two in a coat: one is caught, the other walks on
        else { m.state = 'flee'; m.dizzy = 0; m.carry = false; m.fx = null; m.home = 1; }
        R.beams.push({ x1: cam.x, y1: cam.y - 20, x2: x, y2: y - 20, t: .45, bell: cam.t === 'bell' });
        R.zipX = cam.x; R.zipY = cam.y - 60; cam.t === 'bell' ? sfx.ding() : sfx.flash(); sfx.squawk();
        continue;
      }
    }
    if (active && !arcIgnores(m, 'lamp') && !m.fx && m.dizzy <= 0) {
      const lamp = R.lamps.find(l => !m.bonked.has(l) && Math.hypot(x - l.x, y - l.y) < l.r);
      if (lamp) { m.bonked.add(lamp); m.dizzy = 2.2; sfx.bonk(); }
    }
    if (active && !arcIgnores(m, 'toy') && !m.fx && m.dizzy <= 0) {
      const g = R.toys.find(q => !m.met.has(q) && Math.hypot(x - q.x, y - q.y) < q.r);
      if (g) {
        prank(R, m, g, x, y);
        // a disco ball and a confetti cannon catch everyone in reach at once
        if (g.t === 'disco' || g.t === 'cannon') for (const q of R.mags) if (q !== m && (q.state === 'go' || q.state === 'back') && !q.fx && !q.met.has(g) && !arcIgnores(q, 'toy')) {
          const [qx, qy] = routeAt(ROUTES[q.route], q.d);
          if (Math.hypot(qx - g.x, qy - g.y) < g.r) prank(R, q, g, qx, qy);
        }
      }
    }
    if (m.state === 'go' && !m.fx && m.d >= p.len) {
      R.reached[m.route] = (R.reached[m.route] || 0) + 1; m.reach = 1;
      if (R.holds > 0) { R.holds--; m.state = 'sulk'; sfx.empty(); }
      else if (R.shield > 0) { R.shield--; m.state = 'flee'; m.home = 1; sfx.boing(); }
      else if (R.stolen + R.mags.filter(q => q.carry).length < 3) { m.carry = true; m.state = 'back'; sfx.oops(); }
      else m.state = 'sulk';
    }
    if (m.d < 0) { if (m.carry) { R.stolen++; m.carry = false; } m.state = 'gone'; }   // a jar that left the screen is counted once, as stolen
  }
  if (!alive) R.done = true;
}
// Exactly one kind, specific observation after a test raid.
function observe(R) {
  if (!S.items.some(i => !ITEMS[i.t].deco)) return t('o_none');
  const hit = Object.keys(R.reached);
  if (!hit.length) return t(R.laughed ? 'o_silly' : 'o_great');
  const trick = R.mags.find(m => m.reach && m.trick && !m.fixed);   // a trick that worked comes first: the owl names it and its gadget
  if (trick) return t('o_' + trick.trick);
  const open = hit.find(r => !R.covered[r]);
  if (open === 'lad' && count('bell')) return t('o_bell');
  return t(open ? 'o_route' : 'o_busy', { r: t('r_' + (open || hit[0])) });
}

// The palette has two pages: defences and decorations, and the silly gadgets; from Night 9 a third one with the new gadgets
// (src/91-arc.js). The last button turns the page and shows the page that comes next.
const PALETTE = ['cam', 'lamp', 'bell', 'shield', 'banner', 'flowers', 'scope', 'lights'], SILLY = ['peel', 'tramp', 'tickle', 'bubbler', 'cannon', 'disco'];
scenes.tinker = {
  enter() {
    Object.assign(this, { hand: null, drag: false, px: 0, py: 0, sx: 0, sy: 0, kb: -1, page: this.page || 0 });
    const bar = add(`<div class="hud tbar"><button class="btn round go" id="tDone" aria-label="${esc(t('done'))}">${ic('yes', 28)}</button><span class="sp"></span>${palPill()}
      <button class="btn gold" id="tTest">${ic('pie', 26)}${esc(t('testRaid'))}</button><span class="pill" id="pBeams">${ic('beam', 22)}<b>${S.beams}</b></span></div>`);
    $('#tDone', bar).onclick = () => { sfx.click(); go('hub'); };
    $('#tTest', bar).onclick = () => { sfx.alarm(); go('raid', { test: true }); };
    this.pal = add('<div class="palette"></div>');
    this.fill();
    if (!S.tinkered) { S.tinkered = 1; save(); owlSay(t('tinkerIntro'), { html: picsHtml(['cam', 'lamp', 'bell', 'shield']) }); }
    else if (S.tinkered === 1 && S.night >= 2) { S.tinkered = 2; save(); owlSay(t('sillyIntro'), { html: picsHtml(['party', 'peel', 'tramp', 'disco']) }); }
  },
  fill() {
    const pages = [PALETTE, SILLY].concat(arcNew().length ? [arcNew()] : []);
    this.page %= pages.length;   // another player's save may have fewer pages
    const next = (this.page + 1) % pages.length;
    this.pal.innerHTML = pages[this.page].map(k => `<button class="pal" data-k="${k}" aria-label="${esc(t('i_' + k))}, ${ITEMS[k].cost}">${ic(k, 34)}<span>${ic('beam', 14)}${ITEMS[k].cost}</span></button>`).join('') +
      `<button class="pal more" id="tPage" aria-label="${esc(t(['guards', 'silly', 'arc_new'][next]))}">${ic(['cam', 'party', 'fan'][next], 34)}<span>${ic('skipI', 14)}</span></button>`;
    paintIcons(this.pal);
    this.pal.querySelectorAll('.pal[data-k]').forEach(b => {
      b.onpointerdown = e => { const k = b.dataset.k; this.hand = this.hand === k && !this.drag ? null : k; this.drag = !!this.hand; [this.sx, this.sy] = [this.px, this.py] = [e.clientX, e.clientY]; sfx.click(); this.marks(); };
      // Keyboard: Enter picks the item and hands the keys to the tree (arrows choose a free spot, Enter places it there).
      b.onkeydown = e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const k = b.dataset.k, spots = this.free(k);
        this.hand = this.hand === k ? null : k; this.kb = this.hand && spots.length ? spots[0] : -1;
        this.marks(); b.blur(); e.preventDefault();
      };
    });
    $('#tPage', this.pal).onclick = () => { sfx.pop(); this.page = next; this.hand = null; this.drag = false; this.fill(); $('#tPage', this.pal).focus({ preventScroll: true }); };
    this.marks();
  },
  marks() {
    this.pal.querySelectorAll('.pal[data-k]').forEach(b => {
      const on = b.dataset.k === this.hand, poor = ITEMS[b.dataset.k].cost > S.beams;
      b.classList.toggle('sel', on); b.classList.toggle('poor', poor);
      b.setAttribute('aria-pressed', on); b.setAttribute('aria-disabled', poor);
    });
    refreshHud();
  },
  // The tree gets whatever the palette leaves free: the space above it, or (low landscape) the space to its left.
  T() { const p = this.pal.getBoundingClientRect(); return p.top > V.h * .5 ? fitTree(0, 60, V.w, p.top - 64) : fitTree(0, 60, p.left, V.h - 64); },
  overPal(x, y) { const p = this.pal.getBoundingClientRect(); return x >= p.left && y >= p.top; },
  free(type) { const at = ITEMS[type].at; return MOUNTS.map((m, i) => i).filter(i => (type === 'shield') === (i === VAULT) && (!at || at.includes(i)) && !S.items.some(it => it.m === i)); },
  near(x, y, list, reach) {
    const T = this.T(), [lx, ly] = toTree(T, x, y);
    let best = -1, bd = Math.max(reach, 44 / T.k);
    for (const i of list) { const d = Math.hypot(MOUNTS[i][0] - lx, MOUNTS[i][1] - 20 - ly); if (d < bd) { bd = d; best = i; } }

  },
  lift(m) {

  },
  down(x, y) {

    if (!this.overPal(x, y) && moved) { if (!this.place(this.hand === 'shield' ? (this.free('shield').length ? VAULT : -1) : this.near(x, y, this.free(this.hand), 120))) { this.hand = null; this.marks(); } }
    else if (moved) { this.hand = null; this.marks(); }
  },
  key(e) {
    const list = this.hand ? this.free(this.hand) : S.items.map(it => it.m), d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (d && list.length) { this.kb = list[(list.indexOf(this.kb) + d + list.length) % list.length]; e.preventDefault(); }

      if (free.includes(aim)) { drawZone(ctx, this.hand, MOUNTS[aim][0], MOUNTS[aim][1]); ctx.globalAlpha = .7; drawItem(ctx, this.hand, MOUNTS[aim][0], MOUNTS[aim][1], t0, T.k); ctx.globalAlpha = 1; }
    } else if (this.kb >= 0) { const [x, y] = MOUNTS[this.kb]; ctx.lineWidth = Math.max(4, 2 / T.k); ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y - 20, Math.max(34, 16 / T.k), 0, TAU); ctx.stroke(); }
    ctx.restore();

// A raid, watchable like a cartoon. o.test: friendly practice against the player's own design.
// When gadgets made the magpies laugh, the funniest moment is shown once more in slow motion before the result.
scenes.raid = {
  enter(o = {}) {
    this.test = !!o.test; this.endT = 0; this.acc = 0; this.rp = null;
    this.rooms = rank();   // the Night is counted when the raid ends: a room won by it first shows at the ceremony, not here
    const st = this.test ? { cam: S.st.cam || 2, gate: S.st.gate || 2, forge: S.st.forge || 2 } : S.st;
    this.n = S.night; this.plan = raidPlan(this.n, st); this.holds = st.forge - 1;
    this.R = makeRaid(this.plan, this.holds, this.n);
    add(`<div class="hud">${this.test ? `<button class="btn round" id="rBack" aria-label="${esc(t('done'))}">${ic('no', 24)}</button>` : ''}
      <span class="pill">${ic('pie', 24)}${esc(t(this.test ? 'testRaid' : 'raidGo'))}</span><span class="sp"></span>${palPill()}</div>`);
    if (this.test) $('#rBack').onclick = () => { sfx.click(); go('tinker'); };   // a practice raid can be left at any time
    if (!this.test) later(() => toast(t('raidGo')), 100);
  },
  update(dt) {
    if (this.rp) return this.replay(dt);
    const R = this.R;
    if (!R.done) { for (this.acc += dt; this.acc >= STEP && !R.done; this.acc -= STEP) stepRaid(R, STEP); return; }
    if (this.endT) return;
    this.endT = V.t;
    // What the raid earned is counted and saved now; the replay and the owl's word come after.
    if (!this.test) {
      const kind = R.mags.reduce((a, m) => a + (m.home ? m.n : 0), 0);   // sent home without a jar, or laughing
      if (kind) pieCaught(kind);
      this.stars = closeNight(R.stolen, R.laughed);
    } else {
      this.clean = !Object.keys(R.reached).length && S.items.some(i => !ITEMS[i.t].deco); this.bonus = this.clean && S.testStar !== S.night;
      if (this.bonus) { S.testStar = S.night; S.stars++; S.beams += 10; save(); }
    }
    later(() => this.rewind() || this.result(), 800);
  },
  // The funniest moment is the 2.5 seconds with the most antics; chains count for more. The same raid is run again
  // silently up to just before that moment, then played at less than half speed.
  rewind() {
    const fun = this.R.fun;
    if (!fun.length) return false;
    let best = 0, at = 0;
    for (const f of fun) { const w = fun.reduce((a, g) => a + (g.t >= f.t && g.t < f.t + 2.5 ? g.w : 0), 0); if (w > best) { best = w; at = f.t; } }
    const R = makeRaid(this.plan, this.holds, this.n);
    quiet = true;
    while (R.t < at - .7 && !R.done) stepRaid(R, STEP);
    quiet = false;
    this.rp = { R, end: at + 2.3, acc: 0 };
    sfx.rewind();
    const n = add(`<div class="replay"><span class="pill pop">${ic('retry', 22)}${esc(t('replay'))}</span><button class="btn" id="rSkip">${ic('skipI', 22)}${esc(t('skip'))}</button></div>`);
    $('#rSkip', n).onclick = () => { sfx.click(); this.skip(); };
    return true;
  },
  replay(dt) {
    const rp = this.rp;
    for (rp.acc += dt * .4; rp.acc >= STEP && !rp.R.done; rp.acc -= STEP) stepRaid(rp.R, STEP);
    if (rp.R.t >= rp.end || rp.R.done) this.skip();
  },
  skip() {
    if (!this.rp) return;
    this.rp = null;
    const n = $('.replay');
    if (n) n.remove();
    this.result();
  },
  key(e) { if (this.rp && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) { this.skip(); e.preventDefault(); } },
  result() {
    const R = this.R, clean = this.clean, bonus = this.bonus;
    if (!this.test) return finishNight(R.stolen, this.stars);
    if (clean) { sfx.fanfare(); burst(V.w / 2, V.h * .4, 50, { colors: ['#ffd86b', '#ff9ecb', '#7fd0ff', '#6fdc95'], speed: 340, kind: 'star', size: 9, life: 1.5 }); }
    owlSay(observe(R), { title: clean ? t('giveUp') : '', mood: clean ? 'cheer' : 'talk', quiet: clean,
      html: bonus ? `<div class="pics"><span class="pill pop">${ic('star', 24)}${esc(t('bonus'))}</span><span class="pill pop">${ic('beam', 22)}<b>+10</b></span></div>` : '',
      acts: [{ label: t('testRaid'), icon: 'retry', fn: () => go('raid', { test: true }) }, { label: t('ok'), cls: 'go', icon: 'yes', fn: () => go('tinker') }] });

// ---------- Toy mode: Be the Magpie (the Gate Check seen from the other side: why badge and password stay secret) ----------
// The player spies on a forest friend at the gate, builds a fake (disguise, badge, password) and lets the owl or a grown-up
// check it. No stars and no moonbeams: the only prize is the "Fake badge" sticker, the first time ever the owl is fooled.
const PIE_SHOW = 4.2;   // seconds the friend shows the badge and says the password
const PIE_FONT = 'ui-rounded, "Segoe UI", Roboto, sans-serif';
// Disguises: 0 none, 1-4 the gate's small disguises, 5 and 6 a squirrel and a rabbit suit. Icons, names and the bits that fly off.
const PIE_DIS = ['pieHead:0', 'pieHead:1', 'pieHead:2', 'pieHead:3', 'pieHead:4', 'pieSuit:0', 'pieSuit:1'];
const PIE_DIS_NAME = ['pie_d0', 'k_d1', 'k_d2', 'k_d3', 'k_d4', 'k_d5', 'pie_d6'];

const pieShapeName = k => t(k === 'drop' ? 'pie_drop' : k);   // the other four shapes share their word with a gate picture

// A magpie's tail peeking out of an animal suit (the visitor faces left, so the tail points right). Feet at (x, y).
function pieTail(c, x, y, k) {

  poly(c, [10, -20, 58, -10, 55, -1, 10, -10], '#1a1a22'); line(c, [16, -14, 51, -6], '#3f6fe0', 2.5);
  c.restore();
}
// The player's magpie at (0, 0) like a gate visitor; `o.off` means the disguise or the suit has just come off.
function pieVisitor(c, dis, s, t, o = {}) {
  if (dis > 4 && !o.off) pieTail(c, 0, 0, s);

// The badge held up high in front of a visitor (the gate station's numbers). Returns its centre and size.
function pieBadge(c, x, gy, s, b) {

}
// The password bubble's size for a visitor of scale s (as at the gate station).
function pieBubbleSize(s) {
  const isz = clamp(V.w * .1, 34, 30 * s), fs = clamp(isz * .32, 11, 15), col = isz + 24;
  return { isz, fs, col, bw: 3 * col + 8, bh: isz + fs + 18 };
}
// The password in a speech bubble whose bottom edge is at y: each picture with its word, in order.
// o.shown: how many are said so far; o.bar (0..1): time left, a bar along the bottom; o.lo / o.hi: the room to stay in.
// An empty place shows a dashed box with '?'. Returns the bubble and the centre of every picture.
function pieBubble(c, x, y, s, pass, o = {}) {
  const { isz, fs, col, bw, bh: bh0 } = pieBubbleSize(s), bar = o.bar !== undefined, bh = bh0 + (bar ? 16 : 0), top = y - bh;
  const lo = o.lo === undefined ? 6 : o.lo, hi = o.hi === undefined ? V.w - 6 : o.hi, lx = clamp(x - bw / 2, lo, Math.max(lo, hi - bw)), tx = clamp(x, lx + 16, lx + bw - 16);
  rr(c, lx, top, bw, bh, 14); c.fillStyle = '#fff6da'; c.fill(); poly(c, [tx - 8, y - 1, tx + 8, y - 1, tx + 2, y + 12], '#fff6da');
  c.font = `800 ${fs}px ${PIE_FONT}`; c.textAlign = 'center';

    if (p) { drawIcon(c, p, px, py, isz); c.fillStyle = '#2a1c05'; c.fillText(t(p), px, top + isz + fs + 8, col - 4); }

    }

  }
  return { lx, top, bw, bh, col, isz, fs, pts };

scenes.pie = {

  update() {

  // The owl at the gate. Checking: thinking dots. Fooled: a double take (a turn, back, a turn, a jump, wide eyes and "?!").
  drawOwl(t0, k, gx, gy, os) {
    const ph = this.ph, q = k - 1.8;
    let mood = 'idle', flip = 1, jump = 0, wideEyes = false;
    if (ph === 'owlHmm' || ph === 'owlFool' && k < 1) mood = 'talk';
    if (ph === 'owlNo' && k < 2.4) mood = 'no';
    if (ph === 'guardTruth' && !this.letIn) mood = 'cheer';   // the guard won
    if (ph === 'owlFool' && q > 0) {
      if (!still()) { flip = q < .2 || q >= .4 && q < .6 ? -1 : 1; if (q > .6 && q < 1) jump = Math.sin((q - .6) / .4 * Math.PI) * 14; }

  },
  // Spying: the player's magpie peeks out of a bush at the right edge while the friend shows tonight's secrets.
  drawSpy(t0, k, gy, s, cx, gx, g) {
    const ph = this.ph, ms = s * .66, mx = V.w - 8 * ms;
    magpie(ctx, mx, gy, ms, t0, { dir: -1, face: ph === 'spied' ? 'smug' : 'sly' });
    for (const [dx, dy, r, col] of [[-14, -14, 25, '#123c36'], [13, -10, 24, '#164640'], [-36, -5, 18, '#0f332f'], [32, -4, 18, '#0f332f']]) circ(ctx, mx + dx * ms, gy + dy * ms, r * ms, col);

  },
  // The player's magpie at the gate: walking up, being checked, strutting in or sulking off.
  drawCheck(t0, k, gy, s, cx, gx, g) {

    let x = cx, sc = s, a = 1, pose = 'stand', face = 'sly', dir = -1, off = false, show = true, cloud = false, hop = 0;
    if (ph === 'owlIn' || ph === 'guardIn') { x = lerp(V.w + 60, cx, ease(Math.min(1, k / .8))); pose = 'walk'; show = false; }
    if (ph === 'owlLook') face = 'sweat';
    if (ph === 'owlFool') {
      face = 'joy';

        const q = Math.min(1, (k - 1) / 1.3), e = ease(q);

      if (k >= 2.4) { off = true; pose = 'sulk'; dir = 1; show = false; cloud = true; x = lerp(cx, V.w + 90, Math.max(0, (k - 2.8) / 1.5) ** 2); }
    }

    ctx.restore();

      const [bx, by, bs] = pieBadge(ctx, x, gy, s, f), B = pieBubble(ctx, x, gy - 96 * s, s, f.pass), m = this.mark;
      this.bubble = B;
      this.spots = [[bx, by, `badge:${f.shape}:${f.style}`], ...B.pts];

        if (m.badge) pieRing(ctx, bx, by, bs * .78);
        m.pics.forEach((bad, j) => { if (bad) pieRing(ctx, B.pts[j][0], B.top + B.bh / 2, B.col * .47); });
        if (m.perfect) pieBanner(ctx, B.lx + B.bw / 2, B.top, t('pie_perfect'), Math.max(13, B.fs + 1));
      }
    }
    if (this.line && t0 - this.line.t0 < 2.4) pieLine(ctx, x + 30 * s, gy - 40 * s, this.line.text, clamp(14 * s, 13, 20));
    if (ph === 'owlLook' && this.spots) {

      const i = Math.min(3, Math.floor(k / .5)), to = this.spots[i], from = this.spots[Math.max(0, i - 1)], e = still() ? 1 : ease(Math.min(1, (k - i * .5) * 6));

    }
  },
  // The workshop preview: the fake as a visitor would stand at the gate, scaled into the room the panel leaves free.
  drawShop(t0) {
    if (!this.panel) return;
    const land = wide(), p = this.panel.getBoundingClientRect(), ay = this.hudEl.getBoundingClientRect().bottom, f = this.fake;
    const aw = land ? p.left : V.w, ah = (land ? V.h : p.top) - ay;

// ---------- Boot ----------
// A save that is damaged, old or edited by hand must not break the game or reach the page as HTML.
(() => {
  const int = (v, lo, hi) => clamp(v | 0, lo, hi);
  S.night = int(S.night, 1, 1e6); S.beams = int(S.beams, 0, 1e9); S.stars = int(S.stars, 0, 1e9); S.nest = int(S.nest, 0, 3);
  S.briefed = int(S.briefed, 0, S.night); S.testStar |= 0; S.gateStar |= 0; S.boss |= 0; S.fooled |= 0; S.tinkered = int(S.tinkered, 0, 2);
  S.name = String(S.name || '').slice(0, 16); S.mute = !!S.mute; S.promo = !!S.promo; S.voice = S.voice !== false;
  S.day = S.day < 0 ? +(S.night > 1) : S.day ? 1 : 0;   // a career from before there were days meets its first morning at once
  const str = (v, re) => typeof v === 'string' && re.test(v) ? v : '';
  for (const k of ['stk', 'own', 'gifts', 'bed', 'pals', 'visit', 'mem']) if (!S[k] || typeof S[k] !== 'object' || Array.isArray(S[k])) S[k] = {};
  for (const k in S.gifts) if (GIFTS.includes(k)) S.gifts[k] = 1; else delete S.gifts[k];
  S.bedN = int(S.bedN, 0, 5); S.bed = { d: String(S.bed.d || '').slice(0, 10), n: int(S.bed.n, 0, 99), more: int(S.bed.more, 0, 99) };
  // the newer fields: counters in range, ids and dates in their plain shapes (they are used as keys and never shown as HTML)
  S.caught = int(S.caught, 0, 1e9); S.lit = int(S.lit, 0, 1e6); S.grow = int(S.grow, 0, 3); S.eye = int(S.eye, 0, 3); S.bdayY = int(S.bdayY, 0, 9999); S.saga = int(S.saga, 0, 3);
  for (const k in S.pals) if (/^[a-z0-9]{1,12}$/.test(k) && S.pals[k]) S.pals[k] = 1; else delete S.pals[k];
  S.helper = str(S.helper, /^[a-z0-9]{0,12}$/); S.flag = str(S.flag, /^[0-9a-z]{0,200}$/); S.bday = str(S.bday, /^\d{1,2}-\d{1,2}$/); S.memD = str(S.memD, /^[\d-]{0,10}$/); S.sup = str(S.sup, /^\d{0,24}$/);
  S.visit = { d: str(S.visit.d, /^[\d-]{0,10}$/), done: S.visit.done ? 1 : 0, n: int(S.visit.n, 0, 1e6) };
  S.mem = { d: str(S.mem.d, /^[\d-]{0,10}$/), k: str(S.mem.k, /^[a-z]{0,10}$/) };
  for (const k in S.stk) if (has(STK, k)) S.stk[k] = S.stk[k] === 2 ? 2 : 1; else delete S.stk[k];
  for (const k in S.own) if (has(WEAR, k)) S.own[k] = 1; else delete S.own[k];
  for (const k of ['hat', 'scarf', 'zhat', 'zscarf']) S[k] = has(WEAR, S[k]) && has(S.own, S[k]) && WEAR[S[k]].hat === k.endsWith('hat') ? S[k] : '';   // only things this player owns
  const st = S.st && typeof S.st === 'object' ? S.st : {};
  S.st = { cam: int(st.cam, 0, 3), gate: int(st.gate, 0, 3), forge: int(st.forge, 0, 3), extra: int(st.extra, 0, 3) };
  S.items = (Array.isArray(S.items) ? S.items : []).filter((it, i, all) => it && has(ITEMS, it.t) && Number.isInteger(it.m) && MOUNTS[it.m] &&
    (it.t === 'shield') === (it.m === VAULT) && all.findIndex(o => o && o.m === it.m) === i).map(it => ({ t: it.t, m: it.m }));
})();
resize();
// `#night` in the address: the Chief comes back from the day's fishing, straight to the Night (a first-time player still starts at home).
go(location.hash === '#night' && (S.name || S.night > 1 || S.briefed) ? 'hub' : 'home');
requestAnimationFrame(frame);
})();
