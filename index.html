<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1437">
<title>The Night Watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1437'/%3E%3Crect x='10' y='9' width='12' height='17' rx='4' fill='%23ffd86b'/%3E%3Crect x='11' y='5' width='10' height='4' rx='1.5' fill='%23b98a4a'/%3E%3C/svg%3E">
<style>
:root {
  --night: #0b1437; --night2: #1b2a6b; --gold: #ffd86b; --cream: #fff6da;
  --go: #3fae5e; --no: #e0553f; --panel: rgba(13, 22, 60, .86); --line: rgba(255, 216, 107, .45);
  --u: clamp(14px, 2.2vmin + 6px, 22px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--cream);
  font: 600 var(--u)/1.3 ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* Side insets (notch in landscape) are applied here; top and bottom insets are added by the bars themselves. */
#ui { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left); right: env(safe-area-inset-right); pointer-events: none; }
#live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
canvas.ic { display: inline-block; vertical-align: middle; flex: none; }

button { font: inherit; color: inherit; }
.btn { min-width: 48px; min-height: 48px; padding: .45em 1em; border: 3px solid rgba(255, 255, 255, .35); border-radius: 999px;
  background: #2b3f8f; color: #fff; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: .45em; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); transition: transform .08s, filter .15s; }
.btn:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.btn:focus-visible, .tile:focus-visible, .card:focus-visible, .pal:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
.btn.go { background: var(--go); } .btn.no { background: var(--no); }
.btn.gold { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.btn.big { font-size: 1.35em; padding: .5em 1.4em; min-height: 64px; }
.btn.round { padding: 0; width: 52px; height: 52px; }
.btn[disabled] { filter: grayscale(1) brightness(.7); cursor: default; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); filter: brightness(1.2); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: .5em; padding: .4em .5em;
  padding-top: calc(.4em + env(safe-area-inset-top)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .sp { flex: 1; pointer-events: none; }
.pill { display: inline-flex; align-items: center; gap: .3em; min-height: 40px; padding: .15em .7em; border-radius: 999px;
  background: var(--panel); border: 2px solid var(--line); font-weight: 800; white-space: nowrap; }

.home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: .6em; text-align: center; pointer-events: none; }
.home > * { pointer-events: auto; }
.title { margin: .2em 0 0; font-size: clamp(30px, 9vmin, 76px); line-height: 1; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 3px #201400, 0 3px 0 #7a4c00, 0 0 18px rgba(255, 200, 80, .7); letter-spacing: .01em; pointer-events: none; }
.home .mid { flex: 1; pointer-events: none; }
.home .row { display: flex; gap: .6em; align-items: center; justify-content: center; flex-wrap: wrap; margin: .35em 0; }
.langs { display: inline-flex; gap: .3em; padding: .25em; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
.langs .btn { min-height: 48px; padding: .1em .7em .1em .4em; box-shadow: none; background: transparent; border-color: transparent; }
.langs .btn[aria-pressed=true] { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.foot { font-size: max(11px, .72em); font-weight: 600; opacity: .85; max-width: 34em; margin: .2em 0 calc(.2em + env(safe-area-inset-bottom)); text-shadow: 0 1px 3px #000; }

.veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: .7em; background: rgba(6, 10, 32, .55); pointer-events: auto; }
.dlg { width: min(34em, 100%); max-height: 100%; overflow: auto; padding: .8em; border-radius: 1.4em; background: var(--panel);
  border: 3px solid var(--line); text-align: center; box-shadow: 0 0 40px rgba(255, 200, 80, .25); }
.dlg h2 { margin: 0 0 .3em; font-size: 1.3em; color: var(--gold); }
.owlrow { display: flex; align-items: center; gap: .5em; text-align: left; }
.bubble { position: relative; flex: 1; padding: .6em .8em; border-radius: 1.1em; background: var(--cream); color: #2a1c05; font-size: 1.1em; font-weight: 800; }
.bubble::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right: 13px solid var(--cream); }
.pics { display: flex; gap: .4em; align-items: center; justify-content: center; flex-wrap: wrap; margin: .5em 0 0; }
.acts { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin-top: .7em; }
.stars { display: flex; gap: .2em; justify-content: center; margin: .3em 0; }
.stars canvas { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.stars canvas:nth-child(2) { animation-delay: .25s; } .stars canvas:nth-child(3) { animation-delay: .5s; }
.goals { display: flex; flex-direction: column; gap: .2em; align-items: flex-start; margin: .4em auto 0; width: fit-content; font-size: .85em; text-align: left; }
.goals div { display: flex; align-items: center; gap: .4em; opacity: .55; } .goals .on { opacity: 1; }
input.name { font: inherit; font-weight: 800; text-align: center; width: min(14em, 100%); min-height: 48px; border-radius: 999px;
  border: 3px solid var(--line); background: #fff; color: #2a1c05; padding: .2em .8em; user-select: text; -webkit-user-select: text; }

.hub { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .5em;
  padding: 3.6em .6em calc(.7em + env(safe-area-inset-bottom)); pointer-events: none; }
.hub > * { pointer-events: auto; }
.hub h2 { margin: 0; font-size: 1.5em; color: var(--gold); text-shadow: 0 2px 6px #000; pointer-events: none; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; width: min(40em, 100%); }
.card { display: flex; flex-direction: column; align-items: center; gap: .15em; min-height: 96px; padding: .5em .3em; border-radius: 1.1em;
  background: var(--panel); border: 3px solid var(--line); cursor: pointer; font-weight: 800; font-size: .85em; line-height: 1.1;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.card:active { transform: translateY(3px); }
.card .stars { margin: 0; } .card .stars canvas { animation: none; }
.card.done { border-color: #8fe3a4; }

.bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .5em; align-items: center; justify-content: center; flex-wrap: wrap;
  padding: .5em .5em calc(.5em + env(safe-area-inset-bottom)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.gatebtns .btn { flex: 1 1 40%; max-width: 15em; min-height: 68px; font-size: 1.3em; }
.badgebar { flex-direction: column; flex-wrap: nowrap; }
.ref { position: absolute; top: calc(4em + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: .5em; align-items: center;
  padding: .25em .7em; border-radius: 1em; background: var(--panel); border: 2px solid var(--line); pointer-events: none; max-width: 96%; }
.ref .sep { width: 2px; align-self: stretch; background: var(--line); }
.ref .lab { display: inline-flex; flex-direction: column; align-items: center; font-size: max(11px, .62em); font-weight: 700; line-height: 1.1; }

.forge { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: .35em; align-items: center;
  padding: .4em .4em calc(.4em + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(6, 10, 32, .9) 22%); pointer-events: none; }
.forge > * { pointer-events: auto; }
.slots { display: flex; gap: .25em; min-height: 58px; padding: .25em; width: min(38em, 100%); justify-content: center; flex-wrap: wrap;
  border-radius: 1em; border: 3px dashed var(--line); background: rgba(0, 0, 0, .3); }
.tiles { display: flex; gap: .3em; flex-wrap: wrap; justify-content: center; width: min(40em, 100%); }
.tile { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 56px; min-height: 56px; padding: .15em .35em;
  border-radius: .8em; border: 3px solid #fff3c4; background: #fff6da; color: #2a1c05; font-weight: 800; font-size: max(11px, .7em); line-height: 1.05; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.tile b { font-size: 1.9em; line-height: 1.1; }
.tile.n { background: #cfe8ff; border-color: #fff; border-radius: 50%; } .tile.s { background: #ffd9ec; border-color: #fff; border-radius: .2em 1.2em; }
.tile:active { transform: translateY(2px); }
.meter { width: min(38em, 100%); text-align: center; font-weight: 900; text-shadow: 0 1px 3px #000; }
.meter .track { position: relative; height: 22px; border-radius: 999px; background: rgba(0, 0, 0, .45); border: 2px solid var(--line); overflow: hidden; }
.meter .fill { height: 100%; width: 0; border-radius: 999px; background: repeating-linear-gradient(45deg, #ffd86b 0 10px, #f2a93b 10px 20px); transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }
.meter .flag { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #fff; box-shadow: 0 0 6px #fff; }
.meter .val { font-size: 1.25em; color: var(--gold); text-shadow: 0 2px 4px #000; }

.palette { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .3em; align-items: stretch; justify-content: center; flex-wrap: wrap;
  padding: .4em .4em calc(.4em + env(safe-area-inset-bottom)); background: rgba(6, 10, 32, .88); border-top: 2px solid var(--line); pointer-events: auto; }
.pal { flex: 1 0 21%; max-width: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 62px; min-height: 58px; padding: .2em .3em;
  border-radius: .9em; border: 3px solid var(--line); background: #22327a; font-weight: 800; font-size: .72em; cursor: grab; touch-action: none; }
.pal.sel { background: #f2b93b; color: #3a2400; border-color: #fff; }
.pal.poor { opacity: .45; }
.pal span { display: inline-flex; align-items: center; gap: .15em; }
.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: .4em 1em; border-radius: 999px; background: var(--cream); color: #2a1c05;
  font-weight: 900; font-size: 1.15em; pointer-events: none; animation: toast 1.6s both; width: max-content; max-width: 94%; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.8); } 12%, 75% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -14px); } }

/* Landscape: the treehouse keeps the left half, menus take the right half. */
@media (min-aspect-ratio: 23/20) {
  .home, .hub { left: 50%; justify-content: center; }
  .home .mid { flex: 0; }
  .forge { left: 45%; top: 3.6em; justify-content: center; background: none; }
  .ref { left: auto; right: .5em; transform: none; }
  .badgebar { left: 50%; top: 0; }
  .title { font-size: clamp(26px, 6.5vw, 72px); }
}
@media (min-width: 560px) { .pal { flex: 0 0 auto; } }   /* room for all eight in one row */
@media (max-width: 380px) { .langs .btn { padding: .1em .4em .1em .2em; } .home .row { gap: .4em; } }
@media (max-width: 430px) {
  .hud { gap: .25em; padding-left: .3em; padding-right: .3em; }
  .hud .pill { padding: .1em .45em; font-size: .82em; }
  .hud .btn.round { width: 48px; height: 48px; }
  .gatebtns .btn { font-size: 1.1em; gap: .3em; padding: .3em .6em; }
}
/* phones and anything lower: smaller tiles keep the Password Forge scene large */
@media (max-height: 700px) {
  .tile { min-width: 48px; min-height: 48px; } .tile b { font-size: 1.5em; } .slots { min-height: 50px; }
}
@media (max-height: 520px) {
  .card { min-height: 64px; } .foot { font-size: max(11px, .62em); }
  /* dialogs must fit a 360 px high screen without scrolling */
  .dlg { padding: .5em .7em; } .dlg h2 { font-size: 1.1em; margin: 0; }
  .dlg .stars canvas { width: 30px !important; height: 30px !important; }
  .dlg canvas.owl { width: 70px !important; height: 65px !important; }
  .bubble { font-size: 1em; padding: .4em .6em; }
  .goals { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .1em .8em; font-size: .75em; margin-top: .2em; }
  .pics { margin-top: .3em; } .acts { margin-top: .4em; }
}
/* A phone on its side: station bars drop the extra pills, and the Tinker palette becomes a two-column strip on the right. */
@media (min-aspect-ratio: 23/20) and (max-height: 520px) {
  .hud.slim .extra, .hud.slim #pStars, .hud.slim #pBeams { display: none; }
  .palette { left: auto; top: 4.6em; width: 10.6em; align-content: flex-start; border-top: 0; border-left: 2px solid var(--line); overflow-y: auto; }
  .pal { flex: 1 0 40%; min-height: 52px; }
  /* the gate reference card stands as a narrow column at the right edge, clear of the visitor's speech bubble */
  .ref { flex-direction: column; gap: .15em; padding: .3em .4em; }
  .ref .sep { width: auto; height: 2px; }
  .ref canvas.ic { width: 26px !important; height: 26px !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .toast { animation: none !important; }   /* its last keyframe is invisible; without motion it simply shows until it is removed */
}
</style>
</head>

    ${o.html || ''}<div class="acts"></div></div></div>`);

  enter(o = {}) {
    this.test = !!o.test; this.endT = 0;
    const st = this.test ? { cam: S.st.cam || 2, gate: S.st.gate || 2, forge: S.st.forge || 2 } : S.st;
    this.R = makeRaid(raidPlan(S.night, st), st.forge - 1);
    add(`<div class="hud">${this.test ? `<button class="btn round" id="rBack" aria-label="${esc(t('done'))}">${ic('no', 24)}</button>` : ''}
      <span class="pill">${ic('pie', 24)}${esc(t(this.test ? 'testRaid' : 'raidGo'))}</span><span class="sp"></span></div>`);
    if (this.test) $('#rBack').onclick = () => { sfx.click(); go('tinker'); };   // a practice raid can be left at any time
    if (!this.test) later(() => toast(t('raidGo')), 100);
  },
  update(dt) {
    const R = this.R;
    if (!R.done) return stepRaid(R, dt);
    if (this.endT) return;
    this.endT = V.t;
    later(() => {
      if (!this.test) return finishNight(R.stolen);
      const clean = !Object.keys(R.reached).length && S.items.some(i => !ITEMS[i.t].deco), bonus = clean && S.testStar !== S.night;
      if (bonus) { S.testStar = S.night; S.stars++; S.beams += 10; save(); }
      if (clean) { sfx.fanfare(); burst(V.w / 2, V.h * .4, 50, { colors: ['#ffd86b', '#ff9ecb', '#7fd0ff', '#6fdc95'], speed: 340, kind: 'star', size: 9, life: 1.5 }); }
      owlSay(observe(R), { title: clean ? t('giveUp') : '', mood: clean ? 'cheer' : 'talk', quiet: clean,
        html: bonus ? `<div class="pics"><span class="pill pop">${ic('star', 24)}${esc(t('bonus'))}</span><span class="pill pop">${ic('beam', 22)}<b>+10</b></span></div>` : '',
        acts: [{ label: t('testRaid'), icon: 'retry', fn: () => go('raid', { test: true }) }, { label: t('ok'), cls: 'go', icon: 'yes', fn: () => go('tinker') }] });
    }, 900);
  },
  draw() {
    const t0 = V.t, R = this.R, T = fitTree(0, 56, V.w, V.h - 70);
    const carrying = R.mags.filter(m => m.carry).length;
    drawSky(ctx, t0);
    drawTree(ctx, T, t0, { zones: true, jars: JARS.length - R.stolen - carrying, nest: R.stolen });
    ctx.save(); ctx.translate(T.ox, T.oy); ctx.scale(T.k, T.k);
    owl(ctx, OWL[0], OWL[1], 1.05, t0, R.done ? (R.stolen ? 'idle' : 'cheer') : carrying ? 'no' : 'sleep');
    for (const d of R.cams) if (d.cd > 0) { ctx.beginPath(); ctx.arc(d.x, d.y - 20, 30, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - d.cd / ITEMS[d.t].cd)); ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    for (const b of R.beams) {
      ctx.globalAlpha = Math.min(1, b.t * 3);
      if (b.bell) { ctx.lineWidth = 5; ctx.strokeStyle = '#ff9ecb'; for (const r of [40, 70]) { ctx.beginPath(); ctx.arc(b.x1, b.y1, r * (1.45 - b.t), 0, TAU); ctx.stroke(); } }
      else { poly(ctx, [b.x1, b.y1, b.x2 - 26, b.y2 - 30, b.x2 + 26, b.y2 + 30], 'rgba(255,246,200,.75)'); glow(ctx, b.x2, b.y2, 70, '255,246,200', .8); }
      ctx.globalAlpha = 1;
    }
    for (const m of R.mags) {
      if (m.state === 'wait' || m.state === 'gone') continue;
      const [x, y, f] = routeAt(ROUTES[m.route], Math.max(0, m.d)), back = m.state !== 'go';
      // on a small tree the raiders are drawn a little larger than life, so the bonks and sulks can be seen
      magpie(ctx, x, y, .62 * Math.max(1, .6 / T.k), t0 + m.at, { dir: back ? -f : f, carry: m.carry, pose: m.dizzy > 0 ? 'dizzy' : { go: 'sneak', back: 'walk', flee: 'flee', sulk: 'sulk' }[m.state], face: m.state === 'flee' ? 'shock' : m.state === 'sulk' ? 'sad' : 'sly' });
    }
    R.zipX = lerp(R.zipX, 500 + Math.sin(t0) * 200, .01); R.zipY = lerp(R.zipY, 150, .01);
    zip(ctx, R.zipX, R.zipY, 1.5, t0, 1);
    ctx.restore();
    fireflies(ctx, t0, 8);
  },
};
// ---------- Boot ----------
// A save that is damaged, old or edited by hand must not break the game or reach the page as HTML.
(() => {
  const int = (v, lo, hi) => clamp(v | 0, lo, hi);
  S.night = int(S.night, 1, 1e6); S.beams = int(S.beams, 0, 1e9); S.stars = int(S.stars, 0, 1e9); S.nest = int(S.nest, 0, 3);
  S.briefed = int(S.briefed, 0, S.night); S.testStar |= 0; S.gateStar |= 0;
  S.name = String(S.name || '').slice(0, 16); S.mute = !!S.mute; S.promo = !!S.promo;
  const st = S.st && typeof S.st === 'object' ? S.st : {};
  S.st = { cam: int(st.cam, 0, 3), gate: int(st.gate, 0, 3), forge: int(st.forge, 0, 3) };
  S.items = (Array.isArray(S.items) ? S.items : []).filter((it, i, all) => it && ITEMS[it.t] && Number.isInteger(it.m) && MOUNTS[it.m] &&
    (it.t === 'shield') === (it.m === VAULT) && all.findIndex(o => o && o.m === it.m) === i).map(it => ({ t: it.t, m: it.m }));
})();
resize();
go('home');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
