<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1437">
<title>First Light Fishing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1437'/%3E%3Cpath d='M5 16q8-9 17 0q-9 9-17 0zM22 16l6-5v10z' fill='%23ffd86b'/%3E%3Ccircle cx='10' cy='15' r='1.5' fill='%230b1437'/%3E%3C/svg%3E">
<style>
:root {
  --night: #0b1437; --night2: #1b2a6b; --gold: #ffd86b; --cream: #fff6da;
  --go: #3fae5e; --no: #e0553f; --panel: rgba(13, 22, 60, .86); --line: rgba(255, 216, 107, .45);
  --u: clamp(14px, 2.2vmin + 6px, 22px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--cream);
  font: 600 var(--u)/1.3 ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* Side insets (notch in landscape) are applied here; top and bottom insets are added by the bars themselves. */
#ui { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left); right: env(safe-area-inset-right); pointer-events: none; }
#live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
canvas.ic { display: inline-block; vertical-align: middle; flex: none; }

button { font: inherit; color: inherit; }
.btn { min-width: 48px; min-height: 48px; padding: .45em 1em; border: 3px solid rgba(255, 255, 255, .35); border-radius: 999px;
  background: #2b3f8f; color: #fff; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: .45em; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); transition: transform .08s, filter .15s; }
.btn:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.btn:focus-visible, .tile:focus-visible, .card:focus-visible, .pal:focus-visible, .stk:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
.btn.go { background: var(--go); } .btn.no { background: var(--no); }
.btn.gold { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.btn.big { font-size: 1.35em; padding: .5em 1.4em; min-height: 64px; }
.btn.round { padding: 0; width: 52px; height: 52px; }
.btn[disabled] { filter: grayscale(1) brightness(.7); cursor: default; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); filter: brightness(1.2); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: .5em; padding: .4em .5em;
  padding-top: calc(.4em + env(safe-area-inset-top)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .sp { flex: 1; pointer-events: none; }
.pill { display: inline-flex; align-items: center; gap: .3em; min-height: 40px; padding: .15em .7em; border-radius: 999px;
  background: var(--panel); border: 2px solid var(--line); font-weight: 800; white-space: nowrap; }

.home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: .6em; text-align: center; pointer-events: none; }
.home > * { pointer-events: auto; }
.title { margin: .2em 0 0; font-size: clamp(30px, 9vmin, 76px); line-height: 1; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 3px #201400, 0 3px 0 #7a4c00, 0 0 18px rgba(255, 200, 80, .7); letter-spacing: .01em; pointer-events: none; }
.home .mid { flex: 1; pointer-events: none; }
.home .row { display: flex; gap: .6em; align-items: center; justify-content: center; flex-wrap: wrap; margin: .35em 0; }
.langs { display: inline-flex; gap: .3em; padding: .25em; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
.langs .btn { min-height: 48px; padding: .1em .7em .1em .4em; box-shadow: none; background: transparent; border-color: transparent; }
.langs .btn[aria-pressed=true] { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.foot { font-size: max(11px, .72em); font-weight: 600; opacity: .85; max-width: 34em; margin: .2em 0 calc(.2em + env(safe-area-inset-bottom)); text-shadow: 0 1px 3px #000; }

.veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: .7em; background: rgba(6, 10, 32, .55); pointer-events: auto; }
.dlg { width: min(34em, 100%); max-height: 100%; overflow: auto; padding: .8em; border-radius: 1.4em; background: var(--panel);
  border: 3px solid var(--line); text-align: center; box-shadow: 0 0 40px rgba(255, 200, 80, .25); }
.dlg h2 { margin: 0 0 .3em; font-size: 1.3em; color: var(--gold); }
.owlrow { display: flex; align-items: center; gap: .5em; text-align: left; }
.bubble { position: relative; flex: 1; padding: .6em .8em; border-radius: 1.1em; background: var(--cream); color: #2a1c05; font-size: 1.1em; font-weight: 800; }
.bubble::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right: 13px solid var(--cream); }
.pics { display: flex; gap: .4em; align-items: center; justify-content: center; flex-wrap: wrap; margin: .5em 0 0; }
.acts { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin-top: .7em; }
.stars { display: flex; gap: .2em; justify-content: center; margin: .3em 0; }
.stars canvas { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.stars canvas:nth-child(2) { animation-delay: .25s; } .stars canvas:nth-child(3) { animation-delay: .5s; }
.goals { display: flex; flex-direction: column; gap: .2em; align-items: flex-start; margin: .4em auto 0; width: fit-content; font-size: .85em; text-align: left; }
.goals div { display: flex; align-items: center; gap: .4em; opacity: .55; } .goals .on { opacity: 1; }
input.name { font: inherit; font-weight: 800; text-align: center; width: min(14em, 100%); min-height: 48px; border-radius: 999px;
  border: 3px solid var(--line); background: #fff; color: #2a1c05; padding: .2em .8em; user-select: text; -webkit-user-select: text; }

.hub { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .5em;
  padding: 3.6em .6em calc(.7em + env(safe-area-inset-bottom)); pointer-events: none; }
.hub > * { pointer-events: auto; }
.hub h2 { margin: 0; font-size: 1.5em; color: var(--gold); text-shadow: 0 2px 6px #000; pointer-events: none; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; width: min(40em, 100%); }
.card { display: flex; flex-direction: column; align-items: center; gap: .15em; min-height: 96px; padding: .5em .3em; border-radius: 1.1em;
  background: var(--panel); border: 3px solid var(--line); cursor: pointer; font-weight: 800; font-size: .85em; line-height: 1.1;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.card:active { transform: translateY(3px); }
.card .stars { margin: 0; } .card .stars canvas { animation: none; }
.card.done { border-color: #8fe3a4; }
.card.bonus { border-style: dashed; }   /* tonight's extra station: a bonus, never needed for the raid */
.cards.four { grid-template-columns: repeat(4, 1fr); }
.cards.four .card { font-size: max(11px, .78em); padding: .45em .15em; }
a.btn { text-decoration: none; }
.btn.round { position: relative; }
.dot { position: absolute; top: 1px; right: 1px; width: 15px; height: 15px; border-radius: 50%; background: var(--gold); border: 2px solid #fff; box-shadow: 0 0 8px var(--gold); }
.certdlg { width: min(46em, 100%); }
img.cert { display: block; width: 100%; max-height: calc(100vh - 9em); object-fit: contain; border-radius: .6em; }
.whos { display: flex; flex-direction: column; gap: .4em; margin: .4em 0; }
.who { display: flex; gap: .4em; align-items: center; }
.who > .btn:first-child { flex: 1; min-width: 0; justify-content: flex-start; }
.who > .btn:first-child span { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who.me > .btn:first-child { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
#print { display: none; }
@media print {
  @page { size: landscape; margin: 10mm; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #c, #ui, #live { display: none !important; }
  #print { display: block; } #print img { width: 100%; }
}

.bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .5em; align-items: center; justify-content: center; flex-wrap: wrap;
  padding: .5em .5em calc(.5em + env(safe-area-inset-bottom)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.gatebtns .btn { flex: 1 1 40%; max-width: 15em; min-height: 68px; font-size: 1.3em; }
.badgebar { flex-direction: column; flex-wrap: nowrap; }
.ref { position: absolute; top: calc(4em + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: .5em; align-items: center;
  padding: .25em .7em; border-radius: 1em; background: var(--panel); border: 2px solid var(--line); pointer-events: none; max-width: 96%; }
.ref .sep { width: 2px; align-self: stretch; background: var(--line); }
.ref .lab { display: inline-flex; flex-direction: column; align-items: center; font-size: max(11px, .62em); font-weight: 700; line-height: 1.1; }

/* .forge and .side: a panel under the scene in portrait, beside it in landscape */
.forge, .side { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: .35em; align-items: center;
  padding: .4em .4em calc(.4em + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(6, 10, 32, .9) 22%); pointer-events: none; }
.forge > *, .side > * { pointer-events: auto; }
.side .row { display: flex; gap: .5em; align-items: center; justify-content: center; flex-wrap: wrap; }
.wears { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3em; width: min(26em, 100%); }
.wears .pal { max-width: none; min-width: 0; cursor: pointer; touch-action: manipulation; }
.pal.try { border-color: #fff; box-shadow: 0 0 0 3px var(--gold); }
.album { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: .4em;
  padding: calc(4em + env(safe-area-inset-top)) .5em calc(.5em + env(safe-area-inset-bottom)); pointer-events: none; }
.album > * { pointer-events: auto; }
.tabs { display: flex; gap: .3em; flex-wrap: wrap; justify-content: center; }
.tabs .btn { padding: .2em .8em .2em .4em; font-size: .85em; }
.tabs .btn[aria-pressed=true] { background: #f2b93b; color: #3a2400; border-color: #fff3c4; }
.stks { display: grid; gap: .4em; width: min(45em, 100%); flex: 1; min-height: 0; align-content: center; }
.stk { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em; min-height: 64px; padding: .2em;
  border-radius: 1em; border: 3px solid var(--line); background: var(--panel); font-weight: 800; font-size: max(11px, .7em); line-height: 1.1; cursor: pointer; }
.stk.none { border-style: dashed; opacity: .7; }
.stk.new::after { content: ""; position: absolute; top: 5px; right: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--gold);
  border: 2px solid #fff; box-shadow: 0 0 8px var(--gold); }
.pill.got { border-radius: 1.2em; text-align: left; padding: .3em .8em .3em .4em; white-space: normal; line-height: 1.15; }
.slots { display: flex; gap: .25em; min-height: 58px; padding: .25em; width: min(38em, 100%); justify-content: center; flex-wrap: wrap;
  border-radius: 1em; border: 3px dashed var(--line); background: rgba(0, 0, 0, .3); }
.tiles { display: flex; gap: .3em; flex-wrap: wrap; justify-content: center; width: min(40em, 100%); }
.tile { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 56px; min-height: 56px; padding: .15em .35em;
  border-radius: .8em; border: 3px solid #fff3c4; background: #fff6da; color: #2a1c05; font-weight: 800; font-size: max(11px, .7em); line-height: 1.05; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.tile b { font-size: 1.9em; line-height: 1.1; }
.tile.n { background: #cfe8ff; border-color: #fff; border-radius: 50%; } .tile.s { background: #ffd9ec; border-color: #fff; border-radius: .2em 1.2em; }
.tile:active { transform: translateY(2px); }
.meter { width: min(38em, 100%); text-align: center; font-weight: 900; text-shadow: 0 1px 3px #000; }
.meter .track { position: relative; height: 22px; border-radius: 999px; background: rgba(0, 0, 0, .45); border: 2px solid var(--line); overflow: hidden; }
.meter .fill { height: 100%; width: 0; border-radius: 999px; background: repeating-linear-gradient(45deg, #ffd86b 0 10px, #f2a93b 10px 20px); transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }
.meter .flag { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #fff; box-shadow: 0 0 6px #fff; }
.meter .val { font-size: 1.25em; color: var(--gold); text-shadow: 0 2px 4px #000; }

.palette { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .3em; align-items: stretch; justify-content: center; flex-wrap: wrap;
  padding: .4em .4em calc(.4em + env(safe-area-inset-bottom)); background: rgba(6, 10, 32, .88); border-top: 2px solid var(--line); pointer-events: auto; }
.pal { flex: 1 0 17%; max-width: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 62px; min-height: 58px; padding: .2em .3em;
  border-radius: .9em; border: 3px solid var(--line); background: #22327a; font-weight: 800; font-size: .72em; cursor: grab; touch-action: none; }
.pal.sel { background: #f2b93b; color: #3a2400; border-color: #fff; }
.pal.poor { opacity: .45; }
.pal span { display: inline-flex; align-items: center; gap: .15em; }
.pal.more { border-style: dashed; background: #4a3470; cursor: pointer; touch-action: manipulation; }   /* turns the palette's page */
.replay { position: absolute; left: 50%; top: calc(4.2em + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: .5em; align-items: center; pointer-events: none; }
.replay > * { pointer-events: auto; }
.replay .pill { background: var(--no); border-color: #fff; color: #fff; }
.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: .4em 1em; border-radius: 999px; background: var(--cream); color: #2a1c05;
  font-weight: 900; font-size: 1.15em; pointer-events: none; animation: toast 1.6s both; width: max-content; max-width: 94%; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.8); } 12%, 75% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -14px); } }

/* Landscape: the treehouse keeps the left half, menus take the right half. */
@media (min-aspect-ratio: 23/20) {
  .home, .hub { left: 50%; justify-content: center; }
  .home .mid { flex: 0; }
  .forge, .side { left: 45%; top: 3.6em; justify-content: center; background: none; }
  .ref { left: auto; right: .5em; transform: none; }
  .badgebar { left: 50%; top: 0; }
  .title { font-size: clamp(26px, 6.5vw, 72px); }
}
@media (min-width: 560px) { .pal { flex: 0 0 auto; } }   /* room for a whole page in one row */
@media (max-width: 380px) { .langs .btn { padding: .1em .4em .1em .2em; } .home .row { gap: .4em; } .home .btn.round { width: 48px; height: 48px; } }
@media (max-width: 430px) {
  .hud { gap: .25em; padding-left: .3em; padding-right: .3em; }
  .hud .pill { padding: .1em .45em; font-size: .82em; }
  .hud .btn.round { width: 48px; height: 48px; }
  .gatebtns .btn { font-size: 1.1em; gap: .3em; padding: .3em .6em; }
}
/* phones and anything lower: smaller tiles keep the Password Forge scene large */
@media (max-height: 700px) {
  .tile { min-width: 48px; min-height: 48px; } .tile b { font-size: 1.5em; } .slots { min-height: 50px; }
}
@media (max-height: 520px) {
  .card { min-height: 64px; } .foot { font-size: max(11px, .62em); }
  /* dialogs must fit a 360 px high screen without scrolling */
  .dlg { padding: .5em .7em; } .dlg h2 { font-size: 1.1em; margin: 0; }
  .dlg .stars canvas { width: 30px !important; height: 30px !important; }
  .dlg canvas.owl { width: 70px !important; height: 65px !important; }
  .bubble { font-size: 1em; padding: .4em .6em; }
  .goals { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .1em .8em; font-size: .75em; margin-top: .2em; }
  .pics { margin-top: .3em; } .acts { margin-top: .4em; }
}
/* A phone on its side: station bars drop the extra pills, and the Tinker palette becomes a two-column strip on the right. */
@media (min-aspect-ratio: 23/20) and (max-height: 520px) {
  .hud.slim .extra, .hud.slim #pStars, .hud.slim #pBeams { display: none; }
  .palette { left: auto; top: 4.6em; width: 15.6em; align-content: flex-start; border-top: 0; border-left: 2px solid var(--line); overflow-y: auto; }   /* three columns: a page of nine fits without scrolling */
  .pal { flex: 1 0 28%; min-height: 52px; }
  /* the gate reference card stands as a narrow column at the right edge, clear of the visitor's speech bubble */
  .ref { flex-direction: column; gap: .15em; padding: .3em .4em; }
  .ref .sep { width: auto; height: 2px; }
  .ref canvas.ic { width: 26px !important; height: 26px !important; }
}
/* A phone on its side: a one-line title leaves room for the shelf of extras on the home screen. */
@media (min-aspect-ratio: 23/20) and (max-height: 520px) {
  .title { font-size: clamp(22px, 4.1vw, 34px); }
  .home .row { margin: .2em 0; gap: .4em; } .home .btn.round { width: 48px; height: 48px; } .home .btn.big { min-height: 54px; font-size: 1.2em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .toast { animation: none !important; }   /* its last keyframe is invisible; without motion it simply shows until it is removed */
}
/* First Light Fishing: additions to the stylesheet it shares with The Night Watch (../src/style.css). */
.subtitle { margin: .2em 0 0; font-size: max(12px, .9em); font-weight: 800; color: var(--cream); text-shadow: 0 1px 4px #000; pointer-events: none; }
.bubble.plain::before { display: none; }
a.btn { text-decoration: none; }
input[type=range] { width: min(9em, 30vw); height: 48px; accent-color: #f2b93b; touch-action: pan-x; }

/* Difficulty plaques: wood near home, then stone, iron and bone. The material is a texture, the tier is the row of moons. */
.plaque { display: inline-flex; flex-direction: column; align-items: center; gap: .15em; padding: .45em .8em; border-radius: .7em; text-align: center;
  font-weight: 800; line-height: 1.15; color: #fff6da; border: 3px solid rgba(0, 0, 0, .35); box-shadow: 0 4px 0 rgba(0, 0, 0, .35); max-width: 100%; }
.plaque b { font-size: 1.1em; }
.plaque i { font-style: normal; font-weight: 700; font-size: max(11px, .8em); opacity: .95; }
.plaque .tierline { font-size: max(11px, .78em); }
.plaque.wood { background: repeating-linear-gradient(92deg, #8a5a34 0 14px, #7c5030 14px 16px); }
.plaque.stone { background: radial-gradient(circle at 30% 20%, #8c94a3, #5f6675); }
.plaque.iron { background: linear-gradient(#4a5160, #2b303b); border-color: #8a94a8; border-style: double; }
.plaque.bone { background: linear-gradient(#e9e3d2, #bdb5a0); color: #2a2520; border-color: #6a6355; border-style: dashed; }
.moonrow { display: inline-flex; gap: 1px; }
.plaque.bone .moonrow { padding: 2px 8px; border-radius: 999px; background: rgba(42, 37, 32, .8); }   /* pale moons need a dark strip on bone */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="live" aria-live="polite"></div>
<script>
(() => {
'use strict';
// ---------- Localization: every UI string, [English, Russian, Italian] side by side ----------
// This file holds the shared strings. Each part of the game adds its own rows to the same table L
// (fish names and notes through defFish, shop goods through defItem, trophies through defAch).
const LANGS = ['en', 'ru', 'it'];
const L = {
  title: ['First Light Fishing', 'Рыбалка на рассвете', 'Pesca alle prime luci'],
  sub: ['A Night Watch Expedition', 'Экспедиция Ночного патруля', 'Una spedizione della Guardia Notturna'],
  lang: ['Language', 'Язык', 'Lingua'],
  langName: ['English', 'Русский', 'Italiano'],
  play: ['Set out', 'В путь', 'Si parte'],
  ok: ['OK', 'Хорошо', 'OK'],
  yes: ['Yes', 'Да', 'Sì'],
  no: ['No', 'Нет', 'No'],
  back: ['Back', 'Назад', 'Indietro'],
  home: ['Home', 'Домой', 'Casa'],
  sound: ['Sound', 'Звук', 'Suono'],
  volume: ['Volume', 'Громкость', 'Volume'],
  sister: ['The Night Watch', 'Ночной патруль', 'La Guardia Notturna'],
  nameAsk: ['What is your name, Chief?', 'Как тебя зовут, командир?', 'Come ti chiami, Capo?'],
  nameDef: ['Chief', 'Командир', 'Capo'],

function jar(c, x, y, s, t, lit = 1) {
  glow(c, x, y, s * 2.2, '255,216,107', .45 * lit);
  rr(c, x - s * .5, y - s * .55, s, s * 1.3, s * .28);
  c.fillStyle = `rgba(255,233,163,${.25 + .5 * lit})`; c.fill();
  c.lineWidth = Math.max(1, s * .07); c.strokeStyle = `rgba(255,255,255,${.5 + .4 * lit})`; c.stroke();
  rr(c, x - s * .42, y - s * .8, s * .84, s * .28, s * .08); c.fillStyle = '#b98a4a'; c.fill();
  for (let i = 0; i < 4; i++) {

    circ(c, x + Math.cos(a) * s * .25, y + s * .12 + Math.sin(a * 1.3) * s * .35, s * (.06 + .03 * Math.sin(t * 5 + i)), `rgba(255,255,255,${lit})`);

//   f_<id> fish name, fn_<id> logbook note; i_<id> goods name, id_<id> what it does; t_<id> trophy name, td_<id> how to earn it.
const SPECIES = {}, ITEMS = {}, ACHS = {};
function defFish(area, id, names, notes, p) { SPECIES[id] = Object.assign({ id, area }, p); AREA[area].fish.push(id); L['f_' + id] = names; L['fn_' + id] = notes; }
function defItem(id, names, descs, p) { ITEMS[id] = Object.assign({ id }, p); L['i_' + id] = names; L['id_' + id] = descs; }
function defAch(id, names, descs, p) { ACHS[id] = Object.assign({ id }, p); L['t_' + id] = names; L['td_' + id] = descs; }

// ----- The logbook decides what is open -----
const caught = id => !!(S.log[id] && S.log[id].n);
const logged = area => AREA[area].fish.filter(caught).length;
const allLogged = () => Object.keys(SPECIES).filter(caught).length;
const meets = c => c.fish ? caught(c.fish) : logged(c.area) >= c.n;
const unlocked = id => !AREA[id].need || AREA[id].need.some(meets);
const canReach = id => unlocked(id) && (!AREA[id].boat || owns('boat'));
// What a locked gate asks for, in words: "Log 6 species in Harbor Lights Pier or Catch The Millstone".
const needText = id => (AREA[id].need || []).map(c => c.fish ? t('needFish', { f: t('f_' + c.fish) }) : t('needLog', { n: c.n, a: t('a_' + c.area) })).join(` ${t('orWord')} `);
// What a tier means in numbers. win: the strike window in milliseconds; band: the width of the safe tension band (0..1);
// fakes: how often a faking fish really fakes; wary: how firmly a wrong lure, depth or action turns a fish away
// (0 = it bites anything, 1 = it refuses, and shows that it does).
const TIER = [null,
  { win: 700, band: .5, fakes: 0, wary: 0 }, { win: 580, band: .44, fakes: .3, wary: .2 }, { win: 460, band: .38, fakes: .6, wary: .5 },
  { win: 370, band: .32, fakes: .8, wary: .7 }, { win: 300, band: .27, fakes: 1, wary: .85 }, { win: 240, band: .22, fakes: 1, wary: .95 },
  { win: 180, band: .18, fakes: 1, wary: 1 }];
// Angler rank: Reed, Brook, River, Lake, Sea, Storm, Abyss, Bell. Rank r opens tackle of tier r in the shop,
// and each rank can be reached in the waters gentler than the ones that tackle is meant for.
const RANKS = [0, 4, 9, 18, 28, 40, 52, 64];
const rank = () => { const n = allLogged(); let r = 0; while (r < 7 && n >= RANKS[r + 1]) r++; return r; };

// ----- Purse and tackle box -----
const owns = id => S.own[id] | 0;
function give(id, n = 1) { S.own[id] = owns(id) + n; save(); }
function pay(n) { S.moons += n; S.earned += n; save(); refreshHud(); emit('moons', { n }); }
function spend(n) {
  if (S.moons < n) return false;
  S.moons -= n; save(); refreshHud();
  return true;
}
function bump(stat, n = 1) { S.stat[stat] = (S.stat[stat] | 0) + n; return S.stat[stat]; }
// What is tied on right now. A lure that ran out falls back to the worm, which never runs out.
function rig() {
  for (const [slot, base] of [['rod', 'rod0'], ['line', 'line0'], ['reel', 'reel0'], ['lure', 'worm']]) {
    const it = ITEMS[S.rig[slot]];
    if (!it || it.kind !== slot || !(it.free || owns(it.id))) S.rig[slot] = base;
  }
  return { rod: ITEMS[S.rig.rod], line: ITEMS[S.rig.line], reel: ITEMS[S.rig.reel], lure: ITEMS[S.rig.lure] };
}

// ----- A landed fish: weighed, written into the logbook, paid for, released -----
// o: { clean (line never in the red, no snag), lure, depth, and anything the trophies want to know }. Returns { first, record, moons }.
function logCatch(id, grams, o = {}) {
  const sp = SPECIES[id], e = S.log[id] || (S.log[id] = { n: 0, best: 0 });
  const first = !e.n, record = !first && grams > e.best;
  e.n++; e.seen = 1;
  if (grams > e.best) e.best = Math.round(grams);
  if (o.lure) e.lure = o.lure;
  if (o.depth !== undefined) e.depth = o.depth;
  const span = Math.max(1, sp.w[1] - sp.w[0]);
  let moons = Math.max(1, Math.round(sp.pay * (.6 + .8 * clamp((grams - sp.w[0]) / span, 0, 1)) * (o.clean ? 1 : .8)));
  if (first) moons *= 3; else if (record) moons = Math.round(moons * 1.25);   // a first catch pays triple, a record pays a bonus
  bump('catches');
  pay(moons);
  emit('catch', Object.assign({ id, area: sp.area, grams, first, record, moons }, o));
  return { first, record, moons };
}

// Someone speaks: the owl (kind, the voice of the gates), the Market magpie, or nobody (a plain card).
// A real modal dialog: the rest of the overlay is inert while it is open, and focus goes back afterwards.
// o: { who: 'owl' | 'pie' | '', title, html, acts: [{ label, cls, icon, fn }], mood }
let portrait = null, closeDlg = null;
function talk(text, o = {}) {
  if (closeDlg) closeDlg();   // never two dialogs at once
  const before = document.activeElement, others = [...ui.children], who = o.who === undefined ? 'owl' : o.who;
  const v = add(`<div class="veil"><div class="dlg pop" role="dialog" aria-modal="true" aria-labelledby="dlgText">
    ${o.title ? `<h2>${esc(o.title)}</h2>` : ''}
    <div class="owlrow">${who ? '<canvas class="owl" style="width:108px;height:100px;flex:none"></canvas>' : ''}<div class="bubble${who ? '' : ' plain'}" id="dlgText">${esc(text)}</div></div>
    ${o.html || ''}<div class="acts"></div></div></div>`);
  others.forEach(el => { el.inert = true; });
  closeDlg = () => { v.remove(); portrait = null; closeDlg = null; others.forEach(el => { el.inert = false; }); };
  const acts = $('.acts', v);
  for (const a of o.acts || [{ label: t('ok'), cls: 'go', icon: 'yes' }]) {
    const b = add(`<button class="btn ${a.cls || ''}">${a.icon ? ic(a.icon, 26) : ''}${esc(a.label)}</button>`, acts);
    b.onclick = () => {
      sfx.click(); closeDlg();
      if (before && before.isConnected && before !== document.body) before.focus({ preventScroll: true });
      if (a.fn) a.fn();
    };
  }
  if (who) {
    const el = $('canvas.owl', v), d = Math.min(window.devicePixelRatio || 1, 2);
    el.width = 108 * d; el.height = 100 * d;
    portrait = { el, c: el.getContext('2d'), d, who, mood: o.mood || 'talk', t0: V.t };
  }
  say(text);
  ($('.btn.go', acts) || acts.firstChild).focus({ preventScroll: true });   // Enter continues; it never leaves by surprise
  return v;
}
function drawPortrait() {
  if (!portrait) return;

  const { c, d, who } = portrait;

}

// ---------- The Junior Chief: the small bird the player walks, paddles and fishes with ----------
// Six feather colours (body, belly), chosen by S.look.col; the hat is S.look.hat (a WEAR hat) or the small guard's cap.
const CHIEF_COLS = [['#e8843a', '#fff3dc'], ['#58a6ff', '#eef6ff'], ['#57c785', '#f4fff4'], ['#ff8ab0', '#fff0f5'], ['#a98be8', '#f6f0ff'], ['#f2c94c', '#fffbe6']];
// Drawn with the feet at (x, y). o: { dir: 1 | -1, pose: 'stand' | 'walk' | 'sit' | 'cast' | 'reel' | 'cheer', lean: -1..1 (the rod's lean while reeling) }.
// Returns [x, y] of the wing tip that holds a rod or a paddle, in the caller's coordinates.
function chief(c, x, y, s, t, o = {}) {
  const [col, bel] = CHIEF_COLS[S.look.col] || CHIEF_COLS[0], dir = o.dir === -1 ? -1 : 1, pose = o.pose || 'stand', calmly = still();
  const step = pose === 'walk' && !calmly ? Math.sin(t * 12) : 0, bob = calmly ? 0 : pose === 'walk' ? Math.abs(step) * -3 : Math.sin(t * 2.2) * 1;
  const hop = pose === 'cheer' && !calmly ? -Math.abs(Math.sin(t * 7)) * 8 : 0;
  // the wing that holds the rod: down at rest, back for a cast, forward and up while reeling, both up for a cheer
  const wing = pose === 'cast' ? -2.3 : pose === 'reel' ? -.9 + (o.lean || 0) * .25 : pose === 'cheer' ? -2.6 : pose === 'sit' ? -.5 : .5;
  c.save(); c.translate(x, y + (bob + hop) * s); c.scale(s * dir, s);
  if (pose !== 'sit') { line(c, [-5, -6, -5 + step * 5, 0], '#c9741f', 2.2); line(c, [5, -6, 5 - step * 5, 0], '#c9741f', 2.2); }
  poly(c, [-14, -18, -30, -12, -27, -22], col);                                   // tail
  ell(c, 0, -22, 18, 19, col); ell(c, 3, -17, 12, 12, bel);                        // body and belly
  c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(0, -22, 18, 19, 0, Math.PI * 1.05, Math.PI * 1.95); c.stroke();   // a rim of light, so the bird shows against dark water
  poly(c, [15, -30, 26, -27, 15, -23], '#ffb02e');                                 // beak
  circ(c, 8, -31, 4.2, '#fff'); circ(c, 9.2, -31, 2.2, '#1a1210'); circ(c, 9.9, -31.8, .8, '#fff');
  if (t % 4.1 < .12) { c.fillStyle = col; c.fillRect(3, -36, 10, 9); }             // a blink
  c.globalAlpha = .5; circ(c, 13, -24, 3, '#ff9ecb'); c.globalAlpha = 1;
  if (S.look.hat && WEAR[S.look.hat]) wearOn(c, S.look.hat, 2, -39, 9, -.08);
  else { ell(c, 3, -39, 13, 3.6, '#2b3f8f'); rr(c, -7, -47, 18, 9, 3.5); c.fillStyle = '#3a52ad'; c.fill(); starPath(c, 2, -42.5, 2.8, 1.2, 5); c.fillStyle = '#ffd24a'; c.fill(); }
  c.save(); c.translate(-2, -24); c.rotate(wing); ell(c, 0, 9, 6.5, 12, '#00000022'); ell(c, 0, 9, 6, 11.5, col); c.restore();
  if (pose === 'cheer') { c.save(); c.translate(6, -24); c.rotate(-wing * .9); ell(c, 0, 9, 6, 11.5, col); c.restore(); }
  c.restore();
  const hx = -2 - Math.sin(wing) * 20, hy = -24 + Math.cos(wing) * 20;
  return [x + hx * s * dir, y + (hy + bob + hop) * s];
}

    if (mini && !ok && id === 'tree') { mapHits[p].id = ''; continue; }   // on a crowded whole map the treehouse speaks for itself
    mapRects[n * 4] = bx; mapRects[n * 4 + 1] = by; mapRects[n * 4 + 2] = P.w; mapRects[n * 4 + 3] = P.h; n++;
    const hp = mapHits[p]; hp.id = id; hp.x = bx; hp.y = by; hp.w = P.w; hp.h = P.h;
    if (bx > V.w || by > V.h || bx + P.w < 0 || by + P.h < 0) continue;

    c.beginPath(); c.moveTo(sx, sy - (mini ? 2 : 8)); c.lineTo(clamp(sx, bx + 6, bx + P.w - 6), clamp(sy, by + 4, by + P.h - 4));
    c.lineWidth = mini ? 1.5 : 2.5; c.strokeStyle = 'rgba(40,24,12,.7)'; c.stroke();

  }
}

  for (let i = 0; i < MAP_CLOUD.length; i += 3) mapGlow(c, S2.storm, MAP_CLOUD[i] + (calmly ? 0 : Math.sin(t * .3) * 4), MAP_CLOUD[i + 1], MAP_CLOUD[i + 2] * 1.6, .8);

// The little boat, painted with S.look.boat. With `me` the Chief sits in it and paddles.
function mapBoat(c, x, y, s, t, dir, me, moving) {

// ----- The scene -----
scenes.map = {
  enter() {
    if (!MAP_NODE[S.at] || S.at !== 'tree' && !(has(AREA, S.at) && canReach(S.at))) S.at = 'tree';
    mapRt = null; mapDrag = null; mapCam.free = false;
    [mapMe.x, mapMe.y] = MAP_NODE[S.at];
    mapMe.boat = !!(AREA[S.at] && AREA[S.at].boat);
    // what changed since the last visit: new ways get a sparkle and a word
    let sig = '';
    for (const a of AREAS) { mapSt[a.id] = mapState(a.id); mapSt[a.id + 'N'] = logged(a.id); sig += mapSt[a.id][0]; }
    sig += owns('boat') > 0;
    mapNew = mapSeen ? AREAS.filter(a => (mapSeen[a.id] === 'lock' || mapSeen[a.id] === 'boat') && (mapSt[a.id] === 'open' || mapSt[a.id] === 'done')).map(a => a.id) : [];
    mapSeen = Object.assign({}, mapSt);
    if (mapLayer && mapLayer.sig !== sig) { mapLayer = null; mapSmall = null; }
    this.sig = sig;
    mapFit();
    mapAim(-1);
    hud(() => go('home'), `<button class="btn round" id="mapAll" aria-pressed="${mapCam.all}" aria-label="${esc(t(mapCam.all ? 'map_me' : 'map_all'))}">${ic('mapI', 30)}</button>`, { home: true });
    $('#mapAll').onclick = mapToggle;
    add(`<div class="bar map-bar"><button class="btn go" id="mapGo"></button></div>`);
    $('#mapGo').onclick = () => { if (S.at === 'tree') { sfx.pop(); go('hub'); } else mapFish(S.at); };
    mapBar();
    // the ambience follows the Chief (`home: true`: being on the map is not a visit; the Chapel waits for its answer)
    if (S.at !== 'chapel' || S.gate) emit('enter', { area: S.at === 'tree' ? 'pond' : S.at, home: true });
    say(t('map_here', { p: mapName(S.at) }));
    if (mapNew.length) { toast(t('map_new', { a: mapName(mapNew[0]) }), 2600); sfx.sparkle(); }
    else if (!S.tut.map) { S.tut.map = 1; save(); toast(t('map_hint'), 3200); }
  },
  update(dt) {
    if (mapRt) mapUpdateTrip(dt);
    else if ((mapMe.idle -= dt) <= 0) { mapMe.idle = 2.5 + rnd(4); if (!mapMe.boat) mapMe.dir = -mapMe.dir; }   // the Chief looks around
    mapAim(dt);
    // birdsong: now and then near home, thinning out with distance, silent near the chapel
    if ((mapChirp -= dt) <= 0) {
      mapChirp = 3 + rnd(5);
      const home = Math.hypot(mapMe.x - 700, mapMe.y - 560), chapel = Math.hypot(mapMe.x - 150, mapMe.y - 1040);
      if (chapel > 420 && rnd() < clamp(1 - home / 650, 0, 1)) sfx.chirp();
    }
    if (mapNew.length) {   // sparkles over a water that just opened
      const [x, y] = mapScreen(mapNew[0]);
      if (x > 0 && x < V.w && y > 0 && y < V.h) burst(x, y, 24, { kind: 'star', colors: ['#ffd86b', '#fff6da'], speed: 140 });
      mapNew.shift();
    }
  },
  draw() {
    const c = ctx, k = mapCam.k, ox = V.w / 2 - mapCam.x * k, oy = V.h / 2 + mapCam.ay - mapCam.y * k;
    if (!mapLayer) { mapLayer = mapPaint(clamp(Math.min(window.devicePixelRatio || 1, 2) * mapCam.kf, 1, 1.75)); mapLayer.sig = this.sig; }
    c.fillStyle = '#060b1f'; c.fillRect(0, 0, V.w, V.h);
    if (mapCam.all && k === mapCam.ko) c.drawImage(mapSmallLayer(), ox, oy, MAP_W * k, MAP_H * k);
    else {   // only the visible part of the big layer
      const R = mapLayer.R, x0 = clamp(-ox / k, 0, MAP_W), y0 = clamp(-oy / k, 0, MAP_H), x1 = clamp((V.w - ox) / k, 0, MAP_W), y1 = clamp((V.h - oy) / k, 0, MAP_H);
      if (x1 > x0 && y1 > y0) c.drawImage(mapLayer.cv, x0 * R, y0 * R, (x1 - x0) * R, (y1 - y0) * R, ox + x0 * k, oy + y0 * k, (x1 - x0) * k, (y1 - y0) * k);
    }
    c.save(); c.translate(ox, oy); c.scale(k, k);
    mapLife(c, V.t);
    c.restore();
    mapPlaques(c);
    mapDrawMe(c, V.t);
  },
  down(x, y) { mapDrag = { x, y, x0: x, y0: y, moved: false }; },
  move(x, y) {
    if (!mapDrag || !hold.on) return;
    if (!mapDrag.moved && Math.hypot(x - mapDrag.x0, y - mapDrag.y0) > 10) mapDrag.moved = true;
    if (mapDrag.moved) { mapCam.x -= (x - mapDrag.x) / mapCam.k; mapCam.y -= (y - mapDrag.y) / mapCam.k; mapCam.free = true; }
    mapDrag.x = x; mapDrag.y = y;
  },
  up(x, y, cancelled) {
    const d = mapDrag;
    mapDrag = null;
    if (!d || d.moved || cancelled) return;
    // a plaque or a place under the finger (the nearest place within reach)
    let id = '';
    for (let i = mapHits.length - 1; i >= 0 && !id; i--) { const h = mapHits[i]; if (h.id && x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) id = h.id; }
    if (!id) {
      let best = mapCam.all ? 30 : 46;
      for (const p of MAP_PLACES) { const [sx, sy] = mapScreen(p), dd = Math.hypot(sx - x, sy - 12 - y); if (dd < best) { best = dd; id = p; } }
    }
    if (id) mapTap(id);
  },
  key(e) {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const dir = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1] }[k];
    if (dir) { if (e.preventDefault) e.preventDefault(); mapStep(dir[0], dir[1]); }
    else if (k === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) mapAct();   // a focused button handles its own Enter
    else if (k === 'm') mapToggle();
  },
  resize() { mapFit(); mapBar(); },
};

// ----- Self-check of the whole table, for the tests: returns a list of problems in plain words (empty when all is well) -----
const FISH_COUNT = { pond: 9, creek: 9, pier: 9, falls: 9, mill: 10, ice: 9, reef: 10, deep: 10, chapel: 10 };
// The contract's ranges by tier: stamina and base pay of an ordinary species (tiers 2, 4 and 6 lie between their neighbours).
const FISH_STAM = [null, [5, 15], [8, 20], [20, 45], [35, 80], [60, 120], [100, 200], [150, 400]];
const FISH_PAY = [null, [4, 12], [8, 20], [15, 40], [30, 80], [60, 160], [120, 320], [250, 600]];
function fishCheck() {
  const bad = [], isNum = (v, lo, hi) => typeof v === 'number' && v >= lo && v <= hi, isInt = (v, lo, hi) => Number.isInteger(v) && isNum(v, lo, hi);
  const FOODS = ['worm', 'bug', 'grain', 'minnow', 'shiny', 'shrimp', 'glow'], MOVES = ['cruise', 'dart', 'lurk', 'school'], BITES = ['slam', 'nibble', 'fake'];
  const TRICKS = ['still', 'lastrun', 'descend', 'light', 'dawnonly', 'squallonly'];
  const lures = Object.values(ITEMS).filter(it => it.kind === 'lure');
  AREAS.forEach((a, ai) => {
    const sp = a.fish.map(id => SPECIES[id]), reg = sp.filter(s => !s.legend), T = a.tier;
    if (sp.length !== FISH_COUNT[a.id]) bad.push(`${a.id}: ${sp.length} species, wants ${FISH_COUNT[a.id]}`);
    const lg = SPECIES[LEGENDS[ai]];
    if (!lg || lg.area !== a.id || !lg.legend) bad.push(`${a.id}: the Legendary ${LEGENDS[ai]} is missing`);
    if (sp.length - reg.length !== 1) bad.push(`${a.id}: ${sp.length - reg.length} Legendaries, wants 1`);
    const topStam = Math.max(...reg.map(s => s.stam)), topPay = Math.max(...reg.map(s => s.pay));
    for (const s of sp) {
      const p = `${a.id}/${s.id}`, no = what => bad.push(`${p}: ${what}`);
      for (const k of ['f_', 'fn_']) for (let i = 0; i < LANGS.length; i++) {
        const v = L[k + s.id] && L[k + s.id][i];
        if (typeof v !== 'string' || !v.trim()) no(`${k === 'f_' ? 'name' : 'note'} missing in ${LANGS[i]}`);
      }
      if (!Array.isArray(s.w) || !(s.w[0] > 0 && s.w[1] > s.w[0])) no('weights');
      if (!isInt(s.depth, 0, 2) || !isInt(s.act, 0, 2)) no('depth or action');
      if (!FOODS.includes(s.food) || !MOVES.includes(s.move) || !BITES.includes(s.bite)) no('food, move or bite');
      if (!isInt(s.fakes, 0, 3) || (s.bite === 'fake') !== (s.fakes > 0)) no('fakes must be 1..3 for a faker and 0 for the rest');
      for (const k of ['pull', 'speed']) if (!isNum(s[k], 1, 10)) no(k);
      for (const k of ['jump', 'dive']) if (!isNum(s[k], 0, 3)) no(k);
      if (!Array.isArray(s.tricks) || s.tricks.some(k => !TRICKS.includes(k))) no('tricks');
      if (s.when !== null && !(Array.isArray(s.when) && s.when.length && s.when.every(k => a.conds.includes(k)))) no('a condition its water never has');
      if (s.zone !== null && !(Array.isArray(s.zone) && isNum(s.zone[0], 0, 1) && isNum(s.zone[1], 0, 1) && s.zone[0] < s.zone[1])) no('zone');
      if (!s.art || !s.art.b || !Array.isArray(s.art.c)) no('art');
      if (s.legend) {
        if (s.rar !== 5 || !isNum(s.size, 2, 3)) no('a Legendary has rarity 5 and size 2..3');
        if (!isNum(s.stam, Math.min(400, 2 * topStam), Math.min(400, 3 * topStam))) no(`stamina ${s.stam}, wants 2-3 times ${topStam}`);
        if (!isNum(s.pay, 8 * topPay, 10 * topPay)) no(`pay ${s.pay}, wants 8-10 times ${topPay}`);
      } else {
        if (!isInt(s.rar, 1, 4) || !isNum(s.size, .4, 2)) no('rarity or size');
        if (!isNum(s.stam, ...FISH_STAM[T])) no(`stamina ${s.stam} outside ${FISH_STAM[T]}`);
        if (!isNum(s.pay, ...FISH_PAY[T])) no(`pay ${s.pay} outside ${FISH_PAY[T]}`);
      }
      // the shop must sell a lure for this exact taste, at a shop tier the water allows
      if (lures.length && !lures.some(l => l.depth === s.depth && l.act === s.act && l.food === s.food && (l.tier | 0) <= T)) no(`no lure in the shop for depth ${s.depth}, action ${s.act}, ${s.food}`);

  c.beginPath(); c.moveTo(gx + .005, gy * .7); c.quadraticCurveTo(gx - .035, (gy + fpy) / 2, gx + .005, fpy * .7); c.strokeStyle = 'rgba(0,0,0,.32)'; c.lineWidth = Math.max(1.2 * line1, .004); c.stroke();
  if (a.b !== 'ray' && a.b !== 'eel') { c.save(); c.translate(gx - .03, H * .12); c.rotate(.5 + sway * 4); c.beginPath(); c.ellipse(-.05, 0, .06 * (.7 + H), .022 * (.7 + H), 0, 0, TAU); c.fillStyle = finc; c.globalAlpha = alpha * .85; c.fill(); c.globalAlpha = alpha; c.strokeStyle = 'rgba(0,0,0,.25)'; c.stroke(); c.restore(); }
  // mouth
  c.beginPath(); c.moveTo(f.xn - .002, H * .05); c.lineTo(f.xn - .035, H * .08); c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = Math.max(1.2 * line1, .004); c.stroke();
  // eye
  const flatEye = a.b === 'ray' || a.b === 'flat';
  fishAt(a.b === 'whisk' ? .1 : a.b === 'pike' ? .12 : a.b === 'ray' ? .2 : .09, true);
  const ex = fpx - .004, ey = fpy * .45 - .004, er = flatEye ? .026 : Math.max(.018, H * .085) * (f.is('eye') ? 1.4 : 1) * (a.b === 'round' ? .7 : 1);
  if (f.is('glass')) { c.beginPath(); c.ellipse(ex - .02, ey - er * .6, er * 2.4, er * 2, 0, 0, TAU); c.fillStyle = 'rgba(200,255,230,.25)'; c.fill(); c.strokeStyle = 'rgba(220,255,240,.6)'; c.stroke(); }
  if (f.is('blind')) { circ(c, ex, ey, er, '#e8e6de'); circ(c, ex, ey, er * .55, 'rgba(180,186,190,.6)'); }
  else { circ(c, ex, ey, er, '#f4f0e0'); circ(c, ex + er * .1, ey, er * .72, a.ec || '#c8a040'); circ(c, ex + er * .15, ey, er * .42, '#101010'); circ(c, ex + er * .3, ey - er * .3, er * .2, '#fff'); }
  // whiskers, beard, lantern stalk and lures
  c.strokeStyle = a.b === 'whisk' || f.is('beard') ? '#2a2018' : finc; if (f.sp.area === 'chapel') c.strokeStyle = '#b8b2a4';
  fishStrokes(c, f, Math.max(1.6 * line1, .006), sway);
  if (f.is('lantern')) glow(c, f.xn + .07, -H * .52, .14, a.gl || '255,230,150', .7);
  fishLights(c, f, true, sway);
  if (legend) {   // a few slow sparkles around a Legendary
    c.fillStyle = '#fff3c4';
    for (let i = 0; i < 4; i++) {
      const k = still() ? .7 : .5 + .5 * Math.sin(t * 2 + i * 1.7), sx = -.4 + f.rnd[10 + i] * .8, sy = (f.rnd[20 + i] < .5 ? -1 : 1) * (H * .55 + .04 + f.rnd[30 + i] * .08);
      c.globalAlpha = alpha * k; starPath(c, sx, sy, .03, .012, 4); c.fill();
    }
    c.globalAlpha = alpha;
  }
}

// Pattern, scales and special skin, inside the body's clip.
function fishPattern(c, f, t, px) {
  const a = f.a, H = f.H, R = f.rnd, x0 = f.xp + .02, x1 = f.xn - .08, pc = a.pc || 'rgba(0,0,0,.35)';
  c.fillStyle = pc;
  switch (a.pat) {
    case 'spots': for (let i = 0; i < 22; i++) circ(c, lerp(x0, x1, R[40 + i]), lerp(-H * .42, H * .2, R[70 + i]), .01 + .012 * R[100 + i], pc); break;
    case 'dots': for (let i = 0; i < 44; i++) circ(c, lerp(x0, x1, R[40 + i]), lerp(-H * .45, H * .4, R[90 + i]), .005 + .005 * R[120 + i], pc); break;
    case 'bars': c.globalAlpha *= .6; for (let i = 0; i < 6; i++) { const bx = lerp(f.xn - f.BL * .2, f.xp + f.BL * .12, i / 5); ell(c, bx, -H * .15, .022 + .008 * R[40 + i], H * .42, pc); } c.globalAlpha /= .6; break;
    case 'stripe': c.globalAlpha *= .7; c.fillRect(f.xp, -H * .06, f.BL, H * .13); c.globalAlpha /= .7; break;
    case 'mottle': c.globalAlpha *= .45; for (let i = 0; i < 16; i++) ell(c, lerp(x0, x1, R[40 + i]), lerp(-H * .45, H * .3, R[60 + i]), .025 + .03 * R[80 + i], .015 + .02 * R[100 + i], pc, R[120 + i] * 3); c.globalAlpha /= .45; break;
    case 'patch': for (let i = 0; i < 4; i++) ell(c, lerp(x0 + .05, x1, R[40 + i]), lerp(-H * .4, H * .1, R[60 + i]), .06 + .05 * R[80 + i], .04 + .04 * R[100 + i], pc, R[120 + i] * 2); break;
  }
  if (f.is('stripe2')) { c.globalAlpha *= .55; ell(c, (f.xn + f.xp) / 2, -H * .03, f.BL * .44, H * .07, a.gl ? `rgb(${a.gl})` : '#ffffff'); c.globalAlpha /= .55; }
  // scales: rows of small arcs, on the portrait only where they can be seen
  const scaly = a.sc !== 0 && !['eel', 'whisk', 'ray', 'flat'].includes(a.b) && px > 70;
  if (scaly || f.is('jewel')) {
    const st = f.is('jewel') ? .045 : Math.max(.026, 6 / px);
    c.lineWidth = Math.max(.8 / px, .003); c.strokeStyle = 'rgba(0,0,0,.16)';
    for (let x = f.xn - f.BL * .22, row = 0; x > f.xp; x -= st, row++) for (let y = -H * .55 + (row % 2) * st * .5; y < H * .55; y += st) {
      if (f.is('jewel')) {   // jewel scales carry the sky's colours, slowly shifting
        c.fillStyle = `hsl(${(x * 300 + y * 200 + (still() ? 0 : t * 30)) % 360 + 360 | 0},80%,66%)`;
        c.beginPath(); c.moveTo(x, y - st * .5); c.lineTo(x - st * .45, y); c.lineTo(x, y + st * .5); c.lineTo(x + st * .45, y); c.closePath(); c.fill(); c.stroke();
      } else { c.beginPath(); c.arc(x, y, st * .55, Math.PI * .6, Math.PI * 1.4); c.stroke(); }
    }
  }
  if (f.is('scars')) { c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = Math.max(1.2 / px, .004); c.beginPath(); for (let i = 0; i < 3; i++) { const sx = lerp(x0 + .1, x1 - .05, R[130 + i]), sy = lerp(-H * .3, H * .1, R[140 + i]); c.moveTo(sx, sy); c.lineTo(sx - .05, sy + .03); } c.stroke(); }
}

// The icon: ic('fishI:' + id, px) is the painted fish, ic('fishI:' + id + ':shadow', px) its silhouette, fitted into the box.
ICON.fishI = (c, id, mode) => {
  if (!SPECIES[id]) return;
  const f = fishShape(id), len = Math.min(1.9 / (f.bx1 - f.bx0), 1.9 / (f.by1 - f.by0)), T = c.getTransform();
  drawFish(c, id, -(f.bx0 + f.bx1) / 2 * len, -(f.by0 + f.by1) / 2 * len, len,
    { mode: mode === 'shadow' ? 'shadow' : 'full', pale: false, t: 0, wag: 0, ppu: T.a / Math.min(window.devicePixelRatio || 1, 2) });
};

      c.onkeyup = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); this.release(); } };
    } else if (st === 'wait' || st === 'bite') {
      b.innerHTML = `<button class="btn" id="spIn">${ic('retry', 24)}${esc(t('spot_reelIn'))}</button>`;
      $('#spIn', b).onclick = () => { sfx.reel(); this.reelIn(); };
    } else if (st === 'fight' || st === 'net') {
      b.innerHTML = `<span class="spot-drag" role="group" aria-label="${esc(t('spot_drag', { n: this.drag }))}">
        <button class="btn round" id="spDl" aria-label="${esc(t('spot_dragL'))}" aria-keyshortcuts="ArrowDown">${ic('spotLess', 20)}</button>
        <span class="lab" aria-hidden="true">${esc(t('spot_dragW'))}</span><span class="spot-pips" id="spPips" role="img"></span>
        <button class="btn round" id="spDt" aria-label="${esc(t('spot_dragT'))}" aria-keyshortcuts="ArrowUp">${ic('spotMore', 20)}</button></span>
        ${st === 'net' ? `<button class="btn gold" id="spNet" aria-keyshortcuts="Enter">${ic('star', 24)}${esc(t('spot_net'))}</button>` : ''}`;
      // after a tap the focus leaves the button, so the space bar goes on reeling
      $('#spDl', b).onclick = e => { this.setDrag(-1); if (e.detail) e.currentTarget.blur(); };
      $('#spDt', b).onclick = e => { this.setDrag(1); if (e.detail) e.currentTarget.blur(); };
      if ($('#spNet', b)) $('#spNet', b).onclick = () => this.netTry();
      this.pips();
    }
    paintIcons(b);
  },
  pips() {
    const p = $('#spPips');
    if (!p) return;
    p.innerHTML = [1, 2, 3, 4, 5].map(i => `<i class="${i <= this.drag ? 'on' : ''}"></i>`).join('');
    p.setAttribute('aria-label', t('spot_drag', { n: this.drag }));
    p.parentNode.setAttribute('aria-label', t('spot_drag', { n: this.drag }));
  },
  setDrag(k) {
    const d = clamp(this.drag + k, 1, 5);
    if (d === this.drag) { sfx.empty(); return; }
    this.drag = d; sfx.reel(); sfx.click();
    if (this.st === 'fight' || this.st === 'net') this.dragChanged = 1;
    this.pips();
    say(t('spot_drag', { n: d }));
  },

  // ----- geometry: where the water is on this screen -----
  geo() {
    const G = this.G, hudEl = $('.hud'), barEl = this.bar;
    const top = hudEl ? hudEl.getBoundingClientRect().bottom : 56;
    const bot = barEl ? barEl.getBoundingClientRect().top : V.h - 64;
    G.w = V.w; G.h = V.h; G.u = clamp(Math.min(V.w / 400, V.h / 640), .75, 2);
    this.meterY = bot - 34;                                         // the tension meter has its own strip above the bar
    G.bed = this.meterY - 6;
    G.surf = Math.round(lerp(top, G.bed, wide() ? .36 : .33));
    G.x0 = V.w * (wide() ? .2 : .24); G.x1 = V.w - 6;
    this.stand();
    this.top = top;
  },
  resize() { this.geo(); },
  // screen position of a water point
  px(p) { return lerp(this.G.x0, this.G.x1, p); },
  py(p, d) { const G = this.G; return G.surf + this.env.swell + d * this.W.bed(clamp(p, 0, 1)) * (G.bed - G.surf); },
  feat(kind, p) { for (const f of this.W.feats || []) if (f.kind === kind && p >= f.p0 && p <= f.p1) return f; return null; },
  feats(kind) { return (this.W.feats || []).filter(f => f.kind === kind); },
};

// ----- Beat 1: the living water. Shadows of the species that fit the condition, each moving by its own signature. -----
Object.assign(scenes.spot, {
  stand() { const G = this.G, s = this.W.stand ? this.W.stand(G, this.env) : [G.x0 - 20, G.surf]; G.ax = s[0]; G.ay = s[1]; },
  popSize() { return 4 + Math.min(3, this.tier >> 1); },
  legendId() { return LEGENDS[AREAS.indexOf(this.A)]; },
  // The species that can be here now: not the Legendary (it comes by its own rule), and only those whose condition it is.
  pool() {
    const c = this.cond, sq = this.env.squall > .85;
    return this.A.fish.filter(id => { const s = SPECIES[id]; return s && !s.legend && (!s.when || s.when.includes(c)) && (!sq || this.brave(s)); });
  },
  brave(s) { return (s.when && s.when.includes('squall')) || (s.tricks || []).includes('squallonly'); },
  zone(s) { return s.zone || [.06, .97]; },
  spawn(init) {
    const pool = this.pool();
    if (!pool.length) return;
    let tot = 0;
    for (const id of pool) tot += SPOT_RAR[SPECIES[id].rar] || 1;
    let r = rnd(tot), id = pool[0];
    for (const k of pool) { r -= SPOT_RAR[SPECIES[k].rar] || 1; if (r <= 0) { id = k; break; } }
    const lead = this.add(id, init);
    if (SPECIES[id].move === 'school') for (let i = 0; i < 2; i++) this.add(id, init, lead);
    // the Chapel: some shadows have no fish behind them at all
    if (this.tw.decoys && Math.random() < .5) this.add(pick(pool), init, null, true);
  },
  // One shadow. p and d are where it is (d: part of the local depth); its weight is chosen now, so a big shadow is a heavy fish.
  add(id, init, lead, decoy) {
    const s = SPECIES[id], z = this.zone(s), k = Math.pow(Math.random(), 1.6), b = SPOT_BANDS[s.depth | 0];
    const f = { id, s, lead, decoy: !!decoy, k, g: lerp(s.w[0], s.w[1], k), p: init ? rnd(z[0], z[1]) : (Math.random() < .5 ? z[0] : z[1]),
      d: rnd(b[0], b[1]), tp: 0, td: 0, v: 0, dir: Math.random() < .5 ? -1 : 1, wait: rnd(.5, 2), st: 'swim', a: init ? 1 : 0, ph: rnd(TAU),
      no: 0, look: 0, wrong: this.tw.still && Math.random() < .5, home: null, asked: 0, wag: 0 };
    if (s.move === 'lurk') {
      // a lurker keeps to cover: reeds, beams, the dock, a snag or a rock inside its zone
      const cover = (this.W.feats || []).filter(c => /reeds|dock|beam|snag|rock|lily/.test(c.kind) && c.p1 >= z[0] && c.p0 <= z[1]);
      if (cover.length) { const c = pick(cover); f.home = (c.p0 + c.p1) / 2; f.p = f.home; if (c.d1 !== undefined) f.d = clamp((c.d0 + c.d1) / 2, .05, .95); }
    }
    this.target(f);
    this.pop.push(f);
    return f;
  },
  // The next place a shadow swims to, by its signature.
  target(f) {
    const s = f.s, z = this.zone(s), b = SPOT_BANDS[s.depth | 0], tide = this.tw.tide ? (this.env.tide - .5) * -.16 : 0;
    let lo = z[0], hi = z[1];
    const drop = this.feats('drop')[0];
    if (drop && s.size >= 1.6) lo = Math.max(lo, drop.p0);       // big shadows keep below the drop-off
    if (f.lead) { f.tp = f.lead.p + rnd(-.04, .04); f.td = f.lead.d + rnd(-.05, .05); return; }
    if (s.move === 'lurk' && f.home !== null) { f.tp = f.home + rnd(-.03, .03); f.td = clamp(f.d + rnd(-.04, .04), b[0], b[1]); f.wait = rnd(2, 5); return; }
    if (s.move === 'cruise') f.tp = f.tp > (lo + hi) / 2 ? lo + rnd(.05) : hi - rnd(.05);   // steady laps end to end
    else if (s.move === 'dart') f.tp = clamp(f.p + rnd(-.25, .25), lo, hi);                 // a quick dash nearby
    else f.tp = rnd(lo, hi);
    f.tp = clamp(f.tp + tide, .03, .98);
    f.td = rnd(b[0], b[1]);
    f.wait = s.move === 'dart' ? rnd(.6, 1.8) : s.move === 'cruise' ? rnd(.2, .8) : rnd(1, 3);
  },
  // Speed in p per second: darts dash, cruisers glide, a fish going for the lure keeps its own pace.
  swimSpeed(f) {
    const sp = f.s.speed || 4;
    if (f.st === 'flee') return .18 + sp * .012;
    if (f.s.move === 'dart' && f.st === 'swim') return .1 + sp * .02;
    return (.025 + sp * .005) * (f.s.move === 'lurk' && f.st === 'swim' ? .5 : 1);
  },
  movePop(dt) {
    const env = this.env;
    for (let i = this.pop.length - 1; i >= 0; i--) {
      const f = this.pop[i];
      f.a = f.st === 'flee' || f.st === 'hide' ? f.a - dt * .8 : Math.min(1, f.a + dt * .5);
      if (f.a <= 0 && (f.st === 'flee' || f.st === 'hide')) { this.pop.splice(i, 1); if (this.sel >= this.pop.length) this.sel = -1; continue; }
      if (f.no > 0) f.no -= dt;
      if (f.st === 'swim' || f.st === 'flee' || f.st === 'hide') {
        if (f.st === 'swim' && f.wait > 0) { f.wait -= dt; f.v *= .9; }
        else {
          const dp = f.tp - f.p, sp = this.swimSpeed(f);
          if (Math.abs(dp) < .01 && f.st === 'swim') this.target(f);
          else { f.v = lerp(f.v, Math.sign(dp) * sp, Math.min(1, dt * 3)); f.p += f.v * dt; if (Math.abs(f.v) > .005) f.dir = f.v > 0 ? 1 : -1; }
          f.d = lerp(f.d, f.td, Math.min(1, dt * .8));
        }
      } else if (f.st === 'go' || f.st === 'look') this.approach(f, dt);
      f.wag = Math.min(1, Math.abs(f.v) * 12 + .25);
      // the squall's peak: all but the bravest go down and hide
      if (env.squall > .85 && f.st === 'swim' && !this.brave(f.s)) { f.st = 'hide'; f.tp = f.p; f.td = .98; }
      f.p = clamp(f.p, -.05, 1.05);
    }
    // keep the water alive: a new shadow now and then, and the Legendary by its own rule
    this.spawnT = (this.spawnT || 0) - dt;
    if (this.spawnT <= 0) {
      this.spawnT = rnd(5, 9);
      if (this.pop.filter(f => f.st !== 'flee' && f.st !== 'hide').length < this.popSize()) this.spawn(false);
      this.legendTry();
    }
  },
  // The Legendary shows seldom, only under its own rule, and more often once the rest of this water is in the logbook.
  legendTry() {
    const id = this.legendId(), s = SPECIES[id];
    if (!s || this.pop.some(f => f.id === id) || (this.F && this.F.id === id)) return;
    const tr = s.tricks || [];
    if (s.when && !s.when.includes(this.cond)) return;
    if (tr.includes('squallonly') && this.cond !== 'squall') return;
    if (tr.includes('dawnonly') && this.cond !== 'dawn') return;
    const others = this.A.fish.filter(k => k !== id), got = others.filter(caught).length / Math.max(1, others.length);
    let k = .01 + .12 * got * got;                            // per check (every 5 to 9 s): about once in ten minutes, once a minute with a full log
    if (tr.includes('light') && this.lure0().lit) k *= 2;   // drawn to a lit lure
    if (Math.random() < k) { this.add(id, false); if (this.tw.bell) this.toll(2); }
  },
  lure0() { return rig().lure; },
  // How visible a shadow is here and now: rain makes it flicker, murk hides it away from the lure, decoys waver.
  seeAlpha(f) {
    let a = f.a * (this.F ? .55 : 1);
    if (this.tw.rain) a *= .3 + .7 * Math.max(0, Math.sin(V.t * 1.7 + f.ph * 5));
    if (this.tw.murk) {
      const L = this.lure, near = L ? 1 - Math.hypot((f.p - L.p) * 1.4, f.d - L.d) / .3 : 0;
      a *= Math.max(f.d < .3 ? .85 : .12, clamp(near, 0, 1));
    }
    if (f.decoy) a *= .45 + .35 * Math.sin(V.t * .9 + f.ph);
    return clamp(a, 0, 1);
  },
  // shadow length in px: the species' size, a little more for a heavy one
  flen(f) { return (30 + 26 * (f.s.size || 1) * (.85 + .3 * f.k)) * this.G.u; },
  hitShadow(x, y) {
    let best = -1, bd = 1e9;
    this.pop.forEach((f, i) => {
      if (f.st === 'flee' || f.st === 'hide' || this.seeAlpha(f) < .15) return;
      const fx = this.px(f.p), fy = this.py(f.p, f.d), r = Math.max(28, this.flen(f) * .6), d = Math.hypot(x - fx, y - fy);
      if (d < r && d < bd) { bd = d; best = i; }
    });
    return best;
  },

  // ----- the shadow card: what the eye can tell, then a name once the fish has been caught -----
  card(i) {
    this.closeCard();
    const f = this.pop[i];
    if (!f) return;
    this.sel = i;
    if (f.decoy) { f.st = 'flee'; f.tp = f.p; sfx.empty(); floatText(this.px(f.p), this.py(f.p, f.d), '?', '#cfd8ff', 20); return; }   // nothing behind it
    const s = f.s, e = S.log[f.id] || (S.log[f.id] = { n: 0, best: 0 }), sz = s.size < .7 ? 0 : s.size < 1.2 ? 1 : s.size < 2 ? 2 : 3;
    if (!e.seen) { e.seen = 1; save(); }
    const known = e.n && e.id, facts = `<p>${esc(t('spot_szL'))}: ${esc(t('spot_sz' + sz))}</p><p>${esc(t('spot_dpL'))}: ${esc(t('spot_d' + (s.depth | 0)))}</p><p>${esc(t('spot_mvL'))}: ${esc(t('spot_m_' + s.move))}</p>`;
    let html = '';
    if (known) {
      html = `<h3>${ic('fishI:' + f.id + ':shadow', 26)}${esc(t('f_' + f.id))}</h3>${facts}` +
        (e.lure ? `<p>${ic('item:' + e.lure, 20)} ${esc(t('spot_likes', { l: t('i_' + e.lure) }))}</p>` : '') +
        (e.depth !== undefined ? `<p>${esc(t('spot_likesD', { d: t('spot_d' + e.depth) }))}</p>` : '');
    } else if (e.n && !f.asked) {
      // caught before but never named from its shadow: three names, one is right
      const others = shuffle(this.A.fish.filter(k => k !== f.id && SPECIES[k] && !SPECIES[k].legend)).slice(0, 2);
      const opts = shuffle([f.id, ...others]);
      html = `<h3>${esc(t('spot_which'))}</h3>${facts}<div class="acts">${opts.map(k => `<button class="btn" data-k="${k}">${esc(t('f_' + k))}</button>`).join('')}</div>`;
    } else html = `<h3>${ic('fishI:' + f.id + ':shadow', 26)}${esc(t('spot_unknown'))}</h3>${facts}`;
    const c = add(`<div class="spot-card pop" role="dialog" aria-label="${esc(t('spot_which'))}"><button class="btn round no spot-x" id="spCardX" aria-label="${esc(t('spot_close'))}">${ic('no', 18)}</button>${html}</div>`);
    c.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      f.asked = 1;
      if (b.dataset.k === f.id) { e.id = 1; save(); sfx.yes(); emit('identify', { id: f.id }); toast(t('spot_right')); this.card(this.pop.indexOf(f)); }
      else { sfx.oops(); nudge(b); toast(t('spot_wrong')); this.closeCard(); }
    });
    $('#spCardX', c).onclick = () => { sfx.click(); this.closeCard(); };
    const x = this.px(f.p), r = c.getBoundingClientRect(), uiR = ui.getBoundingClientRect();
    // to the right of the Chief whenever the screen is wide enough, so the card never hides the bird
    const maxL = uiR.width - r.width - 6;
    c.style.left = clamp(x - uiR.left - r.width / 2, Math.min(this.G.ax - uiR.left + 34 * this.G.u, maxL), maxL) + 'px';
    // the card sits in the sky above the shadow; when the shadow is near the top, it goes below the shadow instead
    const fy = this.py(f.p, f.d), up = Math.max(this.top + 4, Math.min(this.G.surf - r.height - 4, V.h - r.height - 70));
    c.style.top = clamp(up + r.height > fy - 24 && fy + 30 + r.height < this.meterY ? fy + 30 : up, this.top + 4, Math.max(this.top + 4, this.meterY + 30 - r.height)) + 'px';
    ($('[data-k]', c) || $('#spCardX', c)).focus({ preventScroll: true });
    this.cardEl = c;
    this.cardsSeen = (this.cardsSeen || 0) + 1;
    sfx.pop();
  },
  closeCard() { if (this.cardEl) { this.cardEl.remove(); this.cardEl = null; } },

  // ----- Beat 2: the tackle box. What the player owns, by kind, with the numbers that matter; one tap ties it on. -----
  box(open) {
    if (this.boxEl) { this.boxEl.remove(); this.boxEl = null; }
    this.boxOpen = open && (this.st === 'read');
    if (!this.boxOpen) { if (this.lesson === 2) this.lessonT = 99; $('#spBox') && $('#spBox').focus({ preventScroll: true }); return; }
    this.closeCard();
    const R = rig(), pips = (lab, v) => `<span class="spot-stat">${esc(lab)} <b>${[2, 4, 6, 8, 10].map(k => `<i class="${v >= k - 1 ? 'on' : ''}"></i>`).join('')}</b></span>`;
    const info = it => it.kind === 'rod' ? pips(t('spot_pow'), it.pow) + pips(t('spot_fin'), it.fin)
      : it.kind === 'line' ? pips(t('spot_str'), it.str) + pips(t('spot_thin'), it.thin)
      : it.kind === 'reel' ? pips(t('spot_drg'), it.drag) + `<span class="spot-stat">${esc(t('spot_spl', { n: it.spool }))}</span>`
      : `${esc(t('spot_d' + (it.depth | 0)))}, ${esc(t('spot_a' + (it.act | 0)))}, ${esc(t('spot_f_' + it.food))}${it.glow && it.food !== 'glow' ? ', ' + esc(t('spot_glow')) : ''}${it.lit ? ', ' + esc(t('spot_lit')) : ''} · ${esc(it.free ? t('spot_free') : t('spot_left', { n: owns(it.id) }))}`;
    const kinds = ['lure', 'rod', 'line', 'reel'].map(k => {
      const its = Object.values(ITEMS).filter(it => it.kind === k && (it.free || owns(it.id) > 0));
      return `<p class="spot-kind">${esc(t('spot_k_' + k))}</p><div class="spot-row">${its.map(it => `<button class="spot-it" data-id="${it.id}" aria-pressed="${R[k].id === it.id}">${ic('item:' + it.id, 34)}<span>${esc(t('i_' + it.id))}<small>${info(it)}</small></span></button>`).join('')}</div>`;
    }).join('');
    const b = add(`<div class="spot-box" role="dialog" aria-label="${esc(t('spot_tackleT'))}"><h2>${ic('item:' + R.lure.id, 26)}${esc(t('spot_tackleT'))}<span class="sp"></span>
      <button class="btn round" id="spBoxX" aria-label="${esc(t('spot_close'))}" aria-keyshortcuts="Escape">${ic('no', 22)}</button></h2><div class="spot-list">${kinds}</div></div>`);
    b.querySelectorAll('[data-id]').forEach(el => el.onclick = () => {
      const it = ITEMS[el.dataset.id];
      S.rig[it.kind] = it.id; save(); sfx.click(); sfx.reel();
      b.querySelectorAll('.spot-it').forEach(o => { if (ITEMS[o.dataset.id].kind === it.kind) o.setAttribute('aria-pressed', o === el); });
      this.chips(); this.buttons();
      say(t('spot_tied') + ': ' + t('i_' + it.id));
    });
    $('#spBoxX', b).onclick = () => { sfx.click(); this.box(false); };
    this.boxEl = b;
    ($('[aria-pressed=true]', b) || $('#spBoxX', b)).focus({ preventScroll: true });
  },

  // ----- Beat 3: the cast. Placement first (the gold mark on the water), then power (hold, let go on the gold line). -----
  reach() { return clamp(.42 + rig().rod.pow * .058, .45, .99); },
  setMark(p) {
    p = clamp(p, .05, this.reach());
    if (this.tw.ice) {   // the line can only go down through a hole: the mark jumps to the nearest one
      let best = p, bd = 9;
      for (const h of this.feats('hole')) { const c = (h.p0 + h.p1) / 2; if (Math.abs(c - p) < bd && c <= this.reach() + .02) { bd = Math.abs(c - p); best = c; } }
      p = best;
    }
    this.mark = p;
    // keyboard and screen readers follow the highlight: the shadow nearest to the mark
    let bi = -1, bd = .12;
    this.pop.forEach((f, i) => { if (!f.decoy && f.st === 'swim' && Math.abs(f.p - p) < bd && this.seeAlpha(f) > .2) { bd = Math.abs(f.p - p); bi = i; } });
    if (bi >= 0) this.sel = bi;
  },
  charge() {
    if (this.st !== 'read' || this.boxOpen || closeDlg) return;
    this.closeCard();
    this.st = 'power'; this.pow = 0; this.powT = 0;
    sfx.click();
  },
  // Let go: on the gold line lands on the mark; early lands short, late lands long. Wind pushes it sideways.
  release(cancel) {
    if (this.st !== 'power') return;
    const pw = this.pow;
    if (cancel || pw < .1) { this.st = 'read'; if (!cancel) this.note(t('spot_castHint')); return; }
    const miss = pw - SPOT_GOLD, perfect = Math.abs(miss) < .05;
    let p = this.mark + (perfect ? 0 : miss * .6) + this.env.wind * (this.tw.gust ? .14 : 0);
    p = clamp(p, .03, Math.min(1, this.reach() + .08));
    if (this.tw.ice) {   // on the ice a lure that misses a hole slides back to the nearest hole only on a good cast
      const h = this.feat('hole', p);
      if (!h && Math.abs(p - this.mark) < .04) p = this.mark;
    }
    this.castTo(p, perfect);
  },
  // The lure flies (a test can call this directly: castTo(0.5)).
  castTo(p, perfect = true) {
    this.closeCard(); this.box(false);
    const lu = rig().lure;
    this.lure = { p, d: 0, td: 0, x: 0, y: 0, fly: 0, it: lu, tw: 0, still: 0, perfect: !!perfect, clean: true };
    this.st = 'fly'; this.flyT = 0;
    sfx.whoosh();
    this.buttons();
  },
  land() {
    const L = this.lure, p = L.p, lily = this.feat('lily', p), lilyHit = !!lily && Math.abs(p - (lily.p0 + lily.p1) / 2) < (lily.p1 - lily.p0) * .3;
    const x = this.px(p), y = this.py(p, 0);
    emit('cast', { area: this.id, p, perfect: L.perfect, lily: lilyHit });

  // Under the water the near bank goes on down to the bottom just past the angler's feet: earth in cross-section,

  function bankUnder(c, G, bed, sx, cols) {

  // One water: still layers (back, water and an optional `top` layer over the fish) plus the parts that move.

    const blit = (c, img, y) => { const d = dpr(); c.drawImage(img, 0, Math.round(y * d) / d, img.width / d, img.height / d); };
    const lay = (c, G, env) => {

    };

      stand: o.stand, bed: o.bed, feats: o.feats,

  // =============== 1. Sunnybrook Pond: a golden meadow, lily pads, the dock, dragonflies, sleepy water ===============
  {
    const bed = prof([[0, .3], [.34, .4], [.44, .6], [.52, .93], [.8, 1], [.9, .62], [1, .38]]);

    const pal = {

      dusk: Object.assign({ sky: ['#3f447d', '#d8806c', '#ffc977'], sun: [.72, .86, 22, '#ffd27a', '255,160,90'], cloud: 'rgba(255,180,160,.75)', far: '#8a7088', hill: '#a98a56', tree: '#6a5a40', near: '#c49a50', fl: ['#ffe2b0', '#ffb35c', '#ff8aa8'], bank: '#7f7f3c', edge: '#a8a050', w: ['#6a8aa0', '#2c5070', '#152a44'], g: ['#a8906a', '#3f3a2c'], weed: '#2f5a3a', ray: '255,190,130', glint: '#ffd9a0', line: 'rgba(255,215,175,.85)', win: '#ffd27a' }, base),
      dawn: Object.assign({ sky: ['#8eaadc', '#f1c3b6', '#fff0d0'], sun: [.64, .9, 16, '#fff6dc', '255,226,190'], cloud: 'rgba(255,232,226,.8)', far: '#a9b4c8', hill: '#b4c48e', tree: '#7d9a6a', near: '#d4cc8c', fl: ['#fff6ee', '#ffe08a', '#ffb0cc'], bank: '#86aa5c', edge: '#aac87a', w: ['#7ab6bc', '#34728c', '#183e58'], g: ['#c8bc94', '#56604e'], weed: '#3a6f48', ray: '255,236,210', glint: '#fff4e8', line: 'rgba(245,252,255,.9)', mist: 'rgba(255,246,238,.6)', win: '#ffe6a8' }, base),
    };
    // The treehouse oak of the Night Watch, far across the meadow; its window glows at dawn and dusk.
    function treehouse(c, x, y, s, col, win) {
      c.fillStyle = col; c.fillRect(x - s * .07, y - s * .75, s * .14, s * .75);
      c.beginPath();

        for (let i = 0; i < 70; i++) circ(c, sr(w), s - sr(1, 8) * u, sr(.7, 1.5) * u, P.fl[i % 3]);
        if (P.mist) { const g = c.createLinearGradient(0, s - 30 * u, 0, s); g.addColorStop(0, 'rgba(255,246,238,0)'); g.addColorStop(1, P.mist); c.fillStyle = g; c.fillRect(0, s - 30 * u, w, 30 * u + 2); }
        // the near bank, golden grass and flowers, sloping into the water
        bank(c, G, sx, s - 20 * u, P.bank, P.edge);
        tufts(c, -4, sx - 8 * u, s - 19 * u, 26, P.edge, u);
        for (let i = 0; i < 14; i++) circ(c, sr(-4, sx - 10 * u), s - sr(12, 19) * u, sr(1, 1.8) * u, P.fl[i % 3]);
        // the dock: posts above the water, then the boards the Chief stands on
        const de = X(G, .07);
        post(c, de - 3 * u, s - 9 * u, s + 2 * u, 4 * u, P.wood); post(c, (sx + de) / 2, s - 9 * u, s + 2 * u, 4 * u, P.wood);

      water(c, G, P) {

        stone(c, X(G, .185), by(G, bed, .185) - 2 * u, 9 * u, 6 * u, P.rock[0], P.rock[1]);
        for (let i = 0; i < 16; i++) { const p = sr(.44, .99); weed(c, X(G, p), by(G, bed, p) + 2 * u, sr(18, 60) * u, P.weed, sr(1.5, 3) * u, sr(-9, 9) * u); }

        // lily stems from each pad down to the bottom, reed stems at the far bank
        for (const f of feats) if (f.kind === 'lily') { const p = (f.p0 + f.p1) / 2; c.strokeStyle = P.stem; c.lineWidth = 1.2 * u; c.beginPath(); c.moveTo(X(G, p), s); c.quadraticCurveTo(X(G, p) - 6 * u, (s + by(G, bed, p)) / 2, X(G, p) + 3 * u, by(G, bed, p)); c.stroke(); }

  // =============== 2. Willow Creek: a shaded stream under willow tunnels, a light current ===============
  {

    // A willow frond hanging from (x, y): a curved strand with little leaves along it.

        // shafts of light through the gap in the willows

        // ferns on the near bank (the boulder the Chief stands on is painted with the water)
        const rx = X(G, .015);
        for (let i = 0; i < 5; i++) { const fx = sr(-4, rx - 30 * u); for (let k = -2; k <= 2; k++) weed(c, fx, s - 12 * u, sr(10, 16) * u, P.moss, 1.4 * u, k * 6 * u); }
      },
      water(c, G, P) {

      },
      liveBack(c, G, env, P) {

      front(c, G, env, P) {
        const u = G.u, t = T(env), s = G.surf;

        glints(c, G, env, 8, P.line, X(G, .05));

        c.strokeStyle = P.line; c.lineWidth = .9 * u; c.beginPath();
        for (let i = 0; i < 10; i++) { const p = (i < 5 ? .18 : .64) + fr(hash(i) + t * .03) * .12, x = X(G, p), y = s + (2 + hash(i + 9) * 3) * u; c.moveTo(x - 3 * u, y - 1.2 * u); c.lineTo(x, y); c.lineTo(x + 3 * u, y - 1.2 * u); }
        c.stroke();

          const x = fr(hash(i + 3) + t * (.018 + hash(i) * .012)) * (G.w + 30 * u) - 15 * u, y = s + Math.sin(t * 1.6 + i * 2) * .8 * u - .5 * u;

          c.restore();
        }
      },
    });
  }

  // =============== 3. Harbor Lights Pier: a lantern-lit pier at permanent dusk, the tide under the boards ===============
  {
    const bed = prof([[0, .5], [.15, .56], [.32, .62], [.42, .98], [.66, 1], [.76, .7], [1, .62]]);
    const feats = [
      { kind: 'dock', p0: 0, p1: .12, d0: 0, d1: 1 },     // the pilings under the pier
      { kind: 'beam', p0: .26, p1: .29, d0: .3, d1: 1 },  // an old broken piling
      { kind: 'drop', p0: .34, p1: .42, d0: 0, d1: 1 },   // the edge of the channel
      { kind: 'snag', p0: .8, p1: .85, d0: .5, d1: 1 },   // a sunken crab pot and its rope
    ];

    const piles = G => [-4 * G.u + X(G, .12), X(G, .06), G.x0 - 22 * G.u, G.x0 - 64 * G.u];
    const lamps = G => [[G.x0 - 40 * G.u, G.surf - (H + 30) * G.u], [X(G, .11), G.surf - (H + 30) * G.u]];
    let lastTide = -1, flow = 1;
    make('pier', {
      stand: G => [G.x0 - 10 * G.u, G.surf - H * G.u], bed, feats, pal,
      back(c, G, P) {
        const u = G.u, s = G.surf, w = G.w;
        sky(c, G, P.sky);
        glowAt(c, w * .8, s, s * .9, '255,150,90', .6);
        circ(c, w * .8, s - 3 * u, 22 * u, P.sun);
        for (let i = 0; i < 6; i++) streak(c, sr(w), s * sr(.15, .7), sr(40, 110) * u, sr(1.5, 3) * u, i % 2 ? 'rgba(255,160,140,.45)' : 'rgba(255,200,150,.35)');
        // the far shore: a hill town with lit windows and a lighthouse on the cape
        hills(c, G, s - 4 * u, 34 * u, 80 * u, 2.1, P.land2);
        for (let i = 0; i < 18; i++) {
          const x = w * .26 + i * w * .02 + sr(-3, 3) * u, hw = sr(6, 11) * u, hh = sr(7, 16) * u, y = s - 4 * u - sr(4, 20) * u;
          c.fillStyle = P.land; c.fillRect(x, y - hh, hw, hh + 20 * u); poly(c, [x - u, y - hh, x + hw / 2, y - hh - hw * .6, x + hw + u, y - hh], P.land);

        poly(c, [w * .78, s - 4 * u, w * .86, s - 16 * u, w * .96, s - 18 * u, w + 4, s - 12 * u, w + 4, s - 4 * u], P.land);

        c.fillStyle = '#c84a3a'; c.fillRect(lx - 3 * u, s - 38 * u, 6 * u, 4 * u); c.fillRect(lx - 3 * u, s - 28 * u, 6 * u, 4 * u);
        poly(c, [lx - 4 * u, s - 46 * u, lx, s - 52 * u, lx + 4 * u, s - 46 * u], '#c84a3a');
        // the far sea: a band with the sunset on it
        c.fillStyle = P.sea; c.fillRect(0, s - 5 * u, w, 7 * u);
        for (let i = 0; i < 12; i++) { c.fillStyle = 'rgba(255,190,120,.6)'; c.fillRect(w * .8 - sr(30, 60) * u + sr(0, 60) * u, s - sr(1, 4) * u, sr(6, 20) * u, .9 * u); }
        // the pier: pilings and braces under the boards, a railing, two lanterns
        const top = s - H * u, ps = piles(G);
        for (const x of ps) post(c, x, top, s + 2 * u, 6 * u, P.wood);
        c.strokeStyle = P.wood[1]; c.lineWidth = 2 * u;

        c.fillStyle = P.wood[0]; c.fillRect(-4, top - 16 * u, X(G, .12) + 4, 2.4 * u);
        for (const [x, y] of lamps(G)) {
          post(c, x, y, top, 3 * u, P.wood);
          glowAt(c, x, y, 34 * u, '255,200,110', .55);
          rr(c, x - 4 * u, y - 7 * u, 8 * u, 10 * u, 1.5 * u); c.fillStyle = P.lamp; c.fill(); c.lineWidth = 1.2 * u; c.strokeStyle = '#3a2a1a'; c.stroke();

        }

        c.strokeStyle = '#c8a870'; c.lineWidth = 1.6 * u; c.beginPath(); c.ellipse(G.x0 - 52 * u, top - 2.5 * u, 7 * u, 2.5 * u, 0, 0, TAU); c.stroke();

      },
      water(c, G, P) {

        poly(c, [bx - 2.5 * u, s + .3 * (byy - s), bx + 2.5 * u, s + .3 * (byy - s) - 4 * u, bx + 2.5 * u, s + .3 * (byy - s) + 3 * u], P.wood[1]);
        const cx = X(G, .825), cyb = by(G, bed, .825);
        c.strokeStyle = '#8a7a5a'; c.lineWidth = 1.2 * u; rr(c, cx - 9 * u, cyb - 11 * u, 18 * u, 12 * u, 2 * u); c.stroke();
        c.beginPath(); for (let k = 1; k < 4; k++) { c.moveTo(cx - 9 * u + k * 4.5 * u, cyb - 11 * u); c.lineTo(cx - 9 * u + k * 4.5 * u, cyb + u); } c.stroke();
        c.strokeStyle = '#a89a72'; c.beginPath(); c.moveTo(cx, cyb - 11 * u); c.bezierCurveTo(cx + 20 * u, cyb - 40 * u, cx - 14 * u, cyb - 60 * u, cx + 6 * u, s + .45 * (cyb - s)); c.stroke();
        for (let i = 0; i < 6; i++) { const p = sr(.45, .95); ell(c, X(G, p), by(G, bed, p) + u, 2.2 * u, 1.2 * u, '#e8d8c0'); }
      },
      liveBack(c, G, env, P) {
        // lanterns breathe; a moth circles each one; the lighthouse turns
        const t = T(env), u = G.u, calmly = still();
        for (let i = 0; i < 2; i++) {
          const l = lamps(G)[i], f = calmly ? .3 : .25 + .12 * Math.sin(t * 7 + i * 3) * Math.sin(t * 2.3 + i);

      front(c, G, env, P) {
